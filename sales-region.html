<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 区域详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.region-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.region-card .name{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.region-card .name .arrow{color:#999;font-size:14px}
.region-card .stats{display:flex;justify-content:space-around;align-items:center}
.stat-item{text-align:center;flex:1;position:relative}
.stat-item:not(:last-child)::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);height:24px;width:.5px;background:rgba(0,0,0,.08)}
.stat-item .num{font-size:18px;font-weight:600;color:#c9302c;margin-bottom:4px}
.stat-item .label{font-size:12px;color:#999}
.stat-item.clickable{position:relative}
.stat-item.clickable:active{opacity:.7}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title" id="pageTitle">区域详情</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const params=new URLSearchParams(location.search);
const parentId=parseInt(params.get('pid')||'0');
const parentName=decodeURIComponent(params.get('name')||'区域详情');
document.getElementById('pageTitle').textContent=parentName;

const allRegions={
  1:[{id:11,name:'长沙市',dealers:8,sales:45,stores:142},{id:12,name:'株洲市',dealers:5,sales:28,stores:86},{id:13,name:'湘潭市',dealers:4,sales:22,stores:68},{id:14,name:'衡阳市',dealers:6,sales:34,stores:98},{id:15,name:'岳阳市',dealers:5,sales:27,stores:88}],
  2:[{id:21,name:'武汉市',dealers:10,sales:58,stores:168},{id:22,name:'宜昌市',dealers:4,sales:24,stores:62},{id:23,name:'襄阳市',dealers:5,sales:31,stores:89},{id:24,name:'荆州市',dealers:3,sales:21,stores:77}],
  3:[{id:31,name:'广州市',dealers:12,sales:72,stores:215},{id:32,name:'深圳市',dealers:10,sales:65,stores:198},{id:33,name:'东莞市',dealers:7,sales:38,stores:112},{id:34,name:'佛山市',dealers:6,sales:26,stores:98}],
  4:[{id:41,name:'南昌市',dealers:7,sales:38,stores:112},{id:42,name:'赣州市',dealers:5,sales:28,stores:78},{id:43,name:'九江市',dealers:3,sales:18,stores:52},{id:44,name:'上饶市',dealers:3,sales:14,stores:45}],
  5:[{id:51,name:'成都市',dealers:9,sales:52,stores:148},{id:52,name:'绵阳市',dealers:5,sales:29,stores:76},{id:53,name:'德阳市',dealers:4,sales:24,stores:68},{id:54,name:'南充市',dealers:4,sales:26,stores:72},{id:55,name:'乐山市',dealers:3,sales:18,stores:48}]
};

const regions=allRegions[parentId]||[];

function render(){
  const box=document.getElementById('content');
  if(regions.length===0){box.innerHTML='<div class="empty">暂无下级区域数据</div>';return;}
  box.innerHTML=regions.map(r=>`
    <div class="region-card" onclick="goRegion(${r.id},'${r.name}')">
      <div class="name">${r.name}<span class="arrow">›</span></div>
      <div class="stats">
        <div class="stat-item clickable" onclick="event.stopPropagation();goDealers(${r.id},'${r.name}')">
          <div class="num">${r.dealers}</div>
          <div class="label">经销商</div>
        </div>
        <div class="stat-item">
          <div class="num">${r.sales}</div>
          <div class="label">业务员</div>
        </div>
        <div class="stat-item">
          <div class="num">${r.stores}</div>
          <div class="label">门店</div>
        </div>
      </div>
    </div>
  `).join('');
}

function goRegion(id,name){
  location.href='sales-region.html?pid='+id+'&name='+encodeURIComponent(name);
}
function goDealers(id,name){
  location.href='dealer-list.html?regionId='+id+'&regionName='+encodeURIComponent(name);
}

render();
</script>
</body>
</html>
