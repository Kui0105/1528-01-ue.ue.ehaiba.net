<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 商品详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gallery{height:260px;background:#f5f6f7;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:14px;border-bottom:.5px solid rgba(0,0,0,.08)}
.info{padding:16px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08)}
.info .name{font-size:17px;font-weight:500;margin-bottom:8px}
.info .price{font-size:15px;color:#c9302c;font-weight:600}
.info .price .orig{font-size:13px;color:#999;text-decoration:line-through;margin-left:8px;font-weight:400}
.info .stock{font-size:12px;color:#999;margin-top:6px}
.detail{padding:16px;background:#fff;margin-top:10px}
.detail h3{font-size:15px;font-weight:500;margin-bottom:12px}
.detail p{font-size:13px;color:#666;line-height:1.8}
.footer{position:sticky;bottom:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:10px 12px;display:flex;gap:10px}
.footer .points{flex:1;display:flex;flex-direction:column;justify-content:center}
.footer .points span:first-child{font-size:11px;color:#999}
.footer .points span:last-child{font-size:16px;color:#c9302c;font-weight:600}
.footer button{flex:2;background:#c9302c;color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;padding:12px}

/* exchange modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px;animation:slideUp .25s ease;position:relative}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-panel .close{position:absolute;top:12px;right:16px;font-size:22px;color:#999;cursor:pointer}
.modal-panel .hd{display:flex;gap:12px;margin-bottom:16px}
.modal-panel .hd .img{width:80px;height:80px;background:#f5f6f7;border-radius:10px;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;flex-shrink:0}
.modal-panel .hd .meta{flex:1}
.modal-panel .hd .meta .name{font-size:15px;font-weight:500;margin-bottom:6px}
.modal-panel .hd .meta .price{font-size:13px;color:#c9302c;font-weight:600}
.modal-panel .hd .meta .price .orig{font-size:11px;color:#999;text-decoration:line-through;margin-left:6px;font-weight:400}
.qty-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;padding:12px 0;border-top:.5px solid rgba(0,0,0,.08);border-bottom:.5px solid rgba(0,0,0,.08)}
.qty-row span{font-size:14px}
.qty-ctrl{display:flex;align-items:center;border:.5px solid rgba(0,0,0,.15);border-radius:6px;overflow:hidden}
.qty-ctrl button{width:34px;height:30px;background:#f5f6f7;border:none;font-size:16px;color:#333;cursor:pointer}
.qty-ctrl .num{width:44px;text-align:center;font-size:14px;font-weight:500}
.modal-btn{display:block;width:100%;background:#c9302c;color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">商品详情</span>
  </div>
  <div class="content">
    <div class="gallery">商品轮播主图区</div>
    <div class="info">
      <div class="name">迈极炫定制打火机</div>
      <div class="price">500 积分<span class="orig">¥39.90</span></div>
      <div class="stock">已兑换 128 件 · 库存充足</div>
    </div>
    <div class="detail">
      <h3>商品详情</h3>
      <p>这里是商品详情描述占位。<br><br>支持展示图文混排内容，包括商品参数、使用说明、注意事项等。后续可替换为真实详情内容。</p>
    </div>
  </div>
  <div class="footer">
    <div class="points"><span>所需积分</span><span id="footerPoints">500</span></div>
    <button id="exchangeBtn">立即兑换</button>
  </div>
</div>

<!-- exchange quantity modal -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-panel">
    <div class="close" onclick="hideModal()">×</div>
    <div class="hd">
      <div class="img">商品图</div>
      <div class="meta">
        <div class="name" id="modalName">商品名称</div>
        <div class="price"><span id="modalPoints">500</span> 积分<span class="orig" id="modalOrig">¥39.90</span></div>
      </div>
    </div>
    <div class="qty-row">
      <span>兑换数量</span>
      <div class="qty-ctrl">
        <button onclick="changeQty(-1)">-</button>
        <div class="num" id="qtyNum">1</div>
        <button onclick="changeQty(1)">+</button>
      </div>
    </div>
    <button class="modal-btn" onclick="toOrder()">立即兑换</button>
  </div>
</div>

<script>
const goods=[
  {name:'迈极炫定制打火机',points:500,orig:'¥39.90',ex:128},
  {name:'便携收纳盒',points:300,orig:'¥19.90',ex:86},
  {name:'品牌毛巾套装',points:800,orig:'¥59.00',ex:45},
  {name:'迈极炫帆布袋',points:450,orig:'¥29.90',ex:72},
  {name:'迷你蓝牙音箱',points:1500,orig:'¥129.00',ex:23},
  {name:'品牌钥匙扣',points:200,orig:'¥9.90',ex:210}
];
const params=new URLSearchParams(location.search);
let id=parseInt(params.get('id')||'0',10);
if(isNaN(id)||id<0||id>=goods.length)id=0;
const g=goods[id];
document.querySelector('.info .name').textContent=g.name;
document.querySelector('.info .price').innerHTML=g.points+' 积分<span class="orig">'+g.orig+'</span>';
document.querySelector('.info .stock').textContent='已兑换 '+g.ex+' 件 · 库存充足';
document.getElementById('footerPoints').textContent=g.points;

let qty=1;
function showModal(){
  qty=1;
  document.getElementById('modalName').textContent=g.name;
  document.getElementById('modalPoints').textContent=g.points;
  document.getElementById('modalOrig').textContent=g.orig;
  document.getElementById('qtyNum').textContent=qty;
  document.getElementById('modal').classList.add('show');
}
function hideModal(){document.getElementById('modal').classList.remove('show');}
function closeModal(e){if(e.target.id==='modal')hideModal();}
function changeQty(n){qty=Math.max(1,Math.min(99,qty+n));document.getElementById('qtyNum').textContent=qty;}
function toOrder(){location.href='order-submit.html?id='+id+'&qty='+qty;}

document.getElementById('exchangeBtn').onclick=showModal;
</script>
</body>
</html>
