<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 门店库存</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.tabs{display:flex;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.tabs .tab{flex:1;text-align:center;height:44px;line-height:44px;font-size:14px;color:#666;position:relative;cursor:pointer}
.tabs .tab.active{color:#c9302c;font-weight:500}
.tabs .tab.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:28px;height:2px;background:#c9302c;border-radius:2px 2px 0 0}

.list{padding:12px}
.goods-item{display:flex;gap:12px;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.goods-item .pic{width:72px;height:72px;border-radius:8px;background:#f5f6f7;border:.5px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.goods-item .pic img{width:100%;height:100%;object-fit:cover}
.goods-item .pic svg{width:28px;height:28px;color:#ccc}
.goods-item .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.goods-item .name{font-size:14px;font-weight:500;line-height:1.4}
.goods-item .sub{font-size:12px;color:#999}
.goods-item .stock{font-size:13px;color:#666;display:flex;align-items:center;gap:6px}
.goods-item .stock b{font-size:18px;color:#c9302c}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title" id="pageTitle">门店库存</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-cat="all" onclick="switchCat(this,'all')">全部</div>
    <div class="tab" data-cat="price20" onclick="switchCat(this,'price20')">20元系列</div>
    <div class="tab" data-cat="price50" onclick="switchCat(this,'price50')">50元系列</div>
    <div class="tab" data-cat="price100" onclick="switchCat(this,'price100')">100元系列</div>
  </div>

  <div class="content">
    <div class="list" id="goodsList"></div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const storeId=params.get('id')||1;
const storeName=['','湘江东路店','五一广场店','岳麓山北店'][storeId]||'门店';
document.getElementById('pageTitle').textContent=storeName+' · 库存';

const allGoods=[
  {id:1,name:'迈极炫槟榔 20元装',spec:'12颗/袋',cat:'price20',stock:18,img:''},
  {id:2,name:'迈极炫槟榔 50元装',spec:'15颗/袋',cat:'price50',stock:8,img:''},
  {id:3,name:'迈极炫槟榔 100元装',spec:'20颗/袋',cat:'price100',stock:5,img:''},
  {id:4,name:'迈极炫定制打火机',spec:'金属/防风',cat:'price20',stock:20,img:''},
  {id:5,name:'品牌毛巾套装',spec:'3条装',cat:'price50',stock:5,img:''},
  {id:6,name:'迈极炫礼盒套装',spec:'100元系列专属',cat:'price100',stock:3,img:''}
];

function switchCat(el,cat){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render(cat);
}

function render(cat){
  const list=cat==='all'?allGoods:allGoods.filter(g=>g.cat===cat);
  const box=document.getElementById('goodsList');
  if(list.length===0){box.innerHTML='<div class="empty">该分类暂无商品</div>';return;}
  box.innerHTML=list.map(g=>`
    <div class="goods-item">
      <div class="pic">${g.img?`<img src="${g.img}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="12" cy="10" r="3"></circle><path d="M3 19l6-6 4 4 5-5 3 3"></path></svg>`}</div>
      <div class="info">
        <div>
          <div class="name">${g.name}</div>
          <div class="sub">${g.spec}</div>
        </div>
        <div class="stock">库存 <b>${g.stock}</b> 件</div>
      </div>
    </div>
  `).join('');
}

render('all');
</script>
</body>
</html>
