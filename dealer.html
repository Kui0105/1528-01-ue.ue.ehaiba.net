<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 经销控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;margin-bottom:12px;overflow:hidden}

/* 经销商信息卡 */
.dealer-card{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.dealer-top{display:flex;align-items:center;gap:14px}
.dealer-top .avatar{width:56px;height:56px;border-radius:50%;background:#fff7f7;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;border:.5px solid rgba(201,48,44,.15)}
.dealer-top .info{flex:1;min-width:0}
.dealer-top .info .name{font-size:17px;font-weight:600;margin-bottom:8px}
.dealer-top .info .badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:4px;background:rgba(42,157,79,.1);color:#2a9d4f}
.dealer-meta{display:flex;gap:10px}
.dealer-meta .col{flex:1;background:#fafafa;border:.5px solid rgba(0,0,0,.06);border-radius:8px;padding:10px 12px}
.dealer-meta .col .label{font-size:12px;color:#999;margin-bottom:4px}
.dealer-meta .col .value{font-size:14px;color:#333;font-weight:500}

/* 积分余额 */
.point-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff5f5,#fff);border:.5px solid rgba(201,48,44,.15);border-radius:8px;padding:12px 14px}
.point-bar .lb{font-size:13px;color:#666}
.point-bar .val{font-size:20px;font-weight:600;color:#c9302c}
.point-bar .val small{font-size:12px;font-weight:400;margin-left:3px}

/* 数据概览 */
.stat-card{padding:16px 14px}
.stat-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stat-title{font-size:15px;font-weight:500}
.filter-trigger{display:flex;align-items:center;gap:4px;font-size:13px;color:#666;cursor:pointer;padding:4px 8px;border:.5px solid rgba(0,0,0,.12);border-radius:6px;background:#fff}
.filter-trigger svg{width:14px;height:14px}
.stat-grid{display:flex}
.stat-item{flex:1;text-align:center;position:relative;padding:2px 0}
.stat-item:not(:last-child)::after{content:'';position:absolute;right:0;top:6px;bottom:6px;width:.5px;background:rgba(0,0,0,.08)}
.stat-item .num{font-size:18px;font-weight:600;color:#c9302c;margin-bottom:4px}
.stat-item .label{font-size:12px;color:#666}

/* 功能入口 */
.menu-card{padding:16px 14px}
.menu-title{font-size:15px;font-weight:500;margin-bottom:16px}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
.menu-item .icon{width:48px;height:48px;border-radius:12px;background:#fff;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.menu-item .icon svg{width:24px;height:24px}
.menu-item .label{font-size:12px;color:#333}
.menu-item:active .icon{background:#fafafa}

/* 筛选底部弹层 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.filter-sheet{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px 0;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;border-bottom:.5px solid rgba(0,0,0,.08)}
.sheet-hd span{font-size:15px;font-weight:500}
.sheet-hd .close{font-size:22px;color:#999;cursor:pointer;width:30px;text-align:right}
.sheet-item{padding:14px 16px;font-size:14px;color:#333;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sheet-item:not(:last-child){border-bottom:.5px solid rgba(0,0,0,.06)}
.sheet-item.active{color:#c9302c}
.sheet-item .check{width:18px;height:18px;display:none}
.sheet-item.active .check{display:block}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">经销控制台</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="content">
    <!-- 经销商信息 -->
    <div class="card dealer-card">
      <div class="dealer-top">
        <div class="avatar">🏪</div>
        <div class="info">
          <div class="name">长沙兴盛商贸有限公司</div>
          <span class="badge">启用</span>
        </div>
      </div>
      <div class="dealer-meta">
        <div class="col">
          <div class="label">省市</div>
          <div class="value">湖南省 长沙市</div>
        </div>
        <div class="col">
          <div class="label">销售区域</div>
          <div class="value">华中大区 · 湖南省</div>
        </div>
      </div>
      <div class="point-bar">
        <div class="lb">积分余额</div>
        <div class="val">12,860<small>分</small></div>
      </div>
    </div>

    <!-- 数据概览 -->
    <div class="card stat-card">
      <div class="stat-hd">
        <div class="stat-title">数据概览</div>
        <div class="filter-trigger" onclick="showFilterSheet()">
          <span id="filterText">全部</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="num" id="statIn">3,600</div>
          <div class="label">进货量</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statAct">3,240</div>
          <div class="label">激活量</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statMov">2,960</div>
          <div class="label">动销量</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statWin">880</div>
          <div class="label">中奖量</div>
        </div>
      </div>
    </div>

    <!-- 功能入口 -->
    <div class="card menu-card">
      <div class="menu-title">功能入口</div>
      <div class="menu-grid">
        <div class="menu-item" onclick="location.href='purchase-mall.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </div>
          <div class="label">进货商城</div>
        </div>
        <div class="menu-item" onclick="location.href='purchase-orders.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
          </div>
          <div class="label">进货订单</div>
        </div>
        <div class="menu-item" onclick="location.href='product-stock.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path><path d="M12 12l8-4.5"></path><path d="M12 12v9"></path><path d="M12 12L4 7.5"></path></svg>
          </div>
          <div class="label">产品库存</div>
        </div>
        <div class="menu-item" onclick="location.href='store.html?from=dealer'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M9 21v-6h6v6"></path></svg>
          </div>
          <div class="label">门店管理</div>
        </div>
        <div class="menu-item" onclick="location.href='business-manage.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"></path><path d="M16 5.4a3 3 0 0 1 0 5.8"></path><path d="M21 20v-1a5 5 0 0 0-3.5-4.8"></path></svg>
          </div>
          <div class="label">业务管理</div>
        </div>
        <div class="menu-item" onclick="location.href='sales-detail.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12"></path><path d="M10 20V5"></path><path d="M16 20v-8"></path><path d="M3 20h18"></path></svg>
          </div>
          <div class="label">销售明细</div>
        </div>
        <div class="menu-item" onclick="location.href='prize-detail.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v8H4v-8"></path><path d="M2 8h20v4H2z"></path><path d="M12 8v12"></path><path d="M12 8C12 6 10.5 4 8.5 4 6.5 4 5.5 6 6.2 8z"></path><path d="M12 8c0-2 1.5-4 3.5-4 2 0 3 2 2.3 4z"></path></svg>
          </div>
          <div class="label">兑奖明细</div>
        </div>
        <div class="menu-item" onclick="location.href='dealer-material-mall.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 16.4 6.7 19.1l1.1-5.8L3.5 9.2l5.9-.8z"></path></svg>
          </div>
          <div class="label">物料商城</div>
        </div>
        <div class="menu-item" onclick="location.href='dealer-points-detail.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10"></path><path d="M9.4 9.6h5.2"></path><path d="M9.4 14.4h5.2"></path></svg>
          </div>
          <div class="label">积分明细</div>
        </div>
        <div class="menu-item" onclick="location.href='dealer-material-orders.html'">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>
          </div>
          <div class="label">物料订单</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 时间筛选弹层 -->
  <div class="modal" id="filterModal" onclick="closeFilterModal(event)">
    <div class="filter-sheet" onclick="event.stopPropagation()">
      <div class="sheet-hd">
        <span>选择时间</span>
        <span class="close" onclick="hideFilterSheet()">×</span>
      </div>
      <div class="sheet-list">
        <div class="sheet-item active" data-type="all" onclick="selectFilter('all','全部')">
          <span>全部</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="today" onclick="selectFilter('today','今日')">
          <span>今日</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="yesterday" onclick="selectFilter('yesterday','昨日')">
          <span>昨日</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="week" onclick="selectFilter('week','本周')">
          <span>本周</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="month" onclick="selectFilter('month','本月')">
          <span>本月</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const statData={
  all:{in:3600,act:3240,mov:2960,win:880},
  today:{in:120,act:98,mov:86,win:24},
  yesterday:{in:105,act:90,mov:78,win:19},
  week:{in:820,act:710,mov:640,win:210},
  month:{in:2680,act:2400,mov:2180,win:680}
};
function fmt(n){return n.toLocaleString('en-US');}
function showFilterSheet(){document.getElementById('filterModal').classList.add('show');}
function hideFilterSheet(){document.getElementById('filterModal').classList.remove('show');}
function closeFilterModal(e){if(e.target.id==='filterModal')hideFilterSheet();}
function selectFilter(type,label){
  document.querySelectorAll('.sheet-item').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.sheet-item[data-type="${type}"]`).classList.add('active');
  document.getElementById('filterText').textContent=label;
  const d=statData[type];
  document.getElementById('statIn').textContent=fmt(d.in);
  document.getElementById('statAct').textContent=fmt(d.act);
  document.getElementById('statMov').textContent=fmt(d.mov);
  document.getElementById('statWin').textContent=fmt(d.win);
  hideFilterSheet();
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
