<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 我的地址</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:12px 12px 90px}

.addr-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.addr-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.addr-card .name{font-size:15px;font-weight:500}
.addr-card .phone{font-size:13px;color:#666}
.addr-card .addr{font-size:13px;color:#666;line-height:1.5}
.addr-card .tag{display:inline-block;margin-top:8px;padding:2px 6px;background:#fcebeb;color:#c9302c;font-size:11px;border-radius:4px}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.empty-state .ic{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:15px;font-weight:500;color:#666;margin-bottom:6px}
.empty-state p{font-size:13px;color:#999}

.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:10px 12px;z-index:20}
.footer .add{width:100%;background:#c9302c;color:#fff;border:none;border-radius:999px;padding:12px;font-size:15px;font-weight:500;cursor:pointer}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">我的地址</span>
  </div>
  <div class="content" id="content">
    <!-- addresses injected here -->
  </div>

  <div class="footer">
    <button class="add" onclick="toast('新增收货地址')">+ 新建收货地址</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const params=new URLSearchParams(location.search);
const from=params.get('from')||'';
const oid=params.get('oid')||'0';
const qty=params.get('qty')||'1';

const addresses=[
  {name:'张三',phone:'138****8888',addr:'广东省 广州市 天河区 科韵路 123 号某某大厦 18 楼',default:true},
  {name:'李四',phone:'139****6666',addr:'广东省 深圳市 南山区 科技园南路 88 号某小区 5 栋 1202',default:false},
  {name:'王五',phone:'137****9999',addr:'广东省 佛山市 禅城区 祖庙路 45 号某广场 3 座 806',default:false}
];

const content=document.getElementById('content');
if(!addresses.length){
  content.innerHTML=`<div class="empty-state"><div class="ic">📍</div><h3>暂无收货地址</h3><p>点击底部按钮新增收货地址</p></div>`;
} else {
  content.innerHTML=addresses.map((a,i)=>`
    <div class="addr-card" onclick="selectAddr(${i})">
      <div class="head">
        <span class="name">${a.name}</span>
        <span class="phone">${a.phone}</span>
      </div>
      <div class="addr">${a.addr}</div>
      ${a.default?'<span class="tag">默认</span>':''}
    </div>
  `).join('');
}

function selectAddr(i){
  const a=addresses[i];
  if(from==='order'){
    location.href=`order-submit.html?id=${oid}&qty=${qty}&addr=1`;
  } else {
    toast(`已选择：${a.name} ${a.phone}`);
  }
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
