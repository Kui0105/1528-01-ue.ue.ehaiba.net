<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 我的地址</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:12px;padding-bottom:90px}

.addr-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.addr-card .user{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:15px;font-weight:500;color:#1a1a1a}
.addr-card .user .phone{font-weight:400;color:#666;font-size:14px}
.addr-card .address{font-size:13px;color:#666;line-height:1.6;margin-bottom:12px}
.addr-card .address .default{display:inline-block;background:#fcebeb;color:#c9302c;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:6px}
.addr-card .actions{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding-top:12px;border-top:.5px solid rgba(0,0,0,.06)}
.addr-card .actions .btn{font-size:13px;color:#666;cursor:pointer;display:flex;align-items:center;gap:4px}
.addr-card .actions .btn.primary{color:#c9302c}

.empty-state{padding:80px 20px;text-align:center;color:#999}
.empty-state .ic{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:15px;font-weight:500;color:#666;margin-bottom:6px}
.empty-state p{font-size:13px}

.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:10px 12px;z-index:20}
.footer button{width:100%;height:44px;background:#c9302c;color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:280px;background:#fff;border-radius:12px;padding:20px;text-align:center}
.modal-panel h3{font-size:16px;font-weight:500;margin-bottom:10px}
.modal-panel p{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px}
.modal-panel .btns{display:flex;gap:10px}
.modal-panel .btns button{flex:1;height:38px;border-radius:999px;border:none;font-size:14px;cursor:pointer}
.modal-panel .btns .cancel{background:#f5f6f7;color:#666}
.modal-panel .btns .confirm{background:#c9302c;color:#fff}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">我的地址</span>
  </div>

  <div class="content" id="content">
    <div id="list"></div>
  </div>

  <div class="footer">
    <button onclick="location.href='address-edit.html'">+ 新增地址</button>
  </div>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <h3>删除地址</h3>
    <p>确认删除该收货地址吗？</p>
    <div class="btns">
      <button class="cancel" onclick="hideModal()">取消</button>
      <button class="confirm" onclick="confirmDelete()">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
let addresses=[
  {id:1,name:'张三',phone:'13888888888',province:'广东省',city:'广州市',district:'天河区',detail:'科韵路 123 号某某大厦 18 楼',isDefault:true},
  {id:2,name:'李四',phone:'13999999999',province:'广东省',city:'深圳市',district:'南山区',detail:'科技园南路 88 号某某中心 6 楼',isDefault:false}
];
let deleteId=null;

function render(){
  const listEl=document.getElementById('list');
  if(!addresses.length){
    listEl.innerHTML=`<div class="empty-state"><div class="ic">📍</div><h3>暂无收货地址</h3><p>点击下方按钮添加新地址</p></div>`;
    return;
  }
  listEl.innerHTML=addresses.map(a=>`
    <div class="addr-card">
      <div class="user">
        <span>${a.name}</span>
        <span class="phone">${a.phone}</span>
      </div>
      <div class="address">
        ${a.isDefault?'<span class="default">默认</span>':''}
        ${a.province}${a.city}${a.district}${a.detail}
      </div>
      <div class="actions">
        <span class="btn ${a.isDefault?'primary':''}" onclick="setDefault(${a.id})">${a.isDefault?'默认地址':'设为默认'}</span>
        <span class="btn" onclick="location.href='address-edit.html?id=${a.id}'">编辑</span>
        <span class="btn" onclick="showDelete(${a.id})">删除</span>
      </div>
    </div>
  `).join('');
}

function setDefault(id){
  addresses.forEach(a=>a.isDefault=(a.id===id));
  render();
  toast('默认地址设置成功');
}

function showDelete(id){
  deleteId=id;
  document.getElementById('modal').classList.add('show');
}
function hideModal(){document.getElementById('modal').classList.remove('show');}
function closeModal(e){if(e.target.id==='modal')hideModal();}
function confirmDelete(){
  if(deleteId){
    addresses=addresses.filter(a=>a.id!==deleteId);
    deleteId=null;
    render();
    toast('地址已删除');
  }
  hideModal();
}

render();

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
