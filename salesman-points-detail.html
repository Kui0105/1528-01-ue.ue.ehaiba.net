<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 业务员积分明细</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}

/* 余额头 */
.balance{background:linear-gradient(135deg,#c9302c,#e8645f);color:#fff;padding:18px 16px;flex-shrink:0}
.balance .lb{font-size:13px;opacity:.9;margin-bottom:6px}
.balance .num{font-size:28px;font-weight:600}
.balance .num small{font-size:13px;font-weight:400;margin-left:4px}

.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.summary{font-size:12px;color:#999;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary b{color:#c9302c;font-weight:600}
.filter-trigger{display:flex;align-items:center;gap:4px;font-size:13px;color:#666;cursor:pointer;padding:4px 8px;border:.5px solid rgba(0,0,0,.12);border-radius:6px;background:#fff;flex-shrink:0}
.filter-trigger svg{width:14px;height:14px}

/* 时间段选择弹层 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.filter-sheet{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px 0;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;border-bottom:.5px solid rgba(0,0,0,.08)}
.sheet-hd span{font-size:15px;font-weight:500}
.sheet-hd .close{font-size:22px;color:#999;cursor:pointer;width:30px;text-align:right}
.range-body{padding:16px 16px 4px}
.range-field{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.range-field label{width:66px;font-size:14px;color:#333;flex-shrink:0}
.range-field input{flex:1;min-width:0;height:40px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;color:#333;background:#fafafa;outline:none;font-family:inherit}
.range-field input:focus{border-color:#c9302c}
.range-tip{font-size:12px;color:#aaa;margin-bottom:14px;line-height:1.5}
.range-ops{display:flex;gap:10px;padding:4px 16px 16px}
.range-ops .btn{flex:1;height:42px;border-radius:10px;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.range-ops .reset{background:#f5f6f7;color:#666}
.range-ops .ok{background:#c9302c;color:#fff}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px}

.rec{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.rec .left{flex:1;min-width:0}
.rec .reason{font-size:14px;font-weight:500;margin-bottom:6px;line-height:1.4}
.rec .time{font-size:12px;color:#999}
.rec .right{text-align:right;flex-shrink:0}
.rec .delta{font-size:16px;font-weight:600;color:#c9302c;margin-bottom:4px}
.rec .bal{font-size:11px;color:#999}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">积分明细</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="balance">
    <div class="lb">当前积分余额</div>
    <div class="num">8,600<small>分</small></div>
  </div>

  <div class="filter-bar">
    <div class="summary" id="summary"></div>
    <div class="filter-trigger" onclick="showFilterSheet()">
      <span id="filterText">全部时间</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <div class="content" id="content"></div>

  <!-- 时间段选择弹层 -->
  <div class="modal" id="filterModal" onclick="closeFilterModal(event)">
    <div class="filter-sheet" onclick="event.stopPropagation()">
      <div class="sheet-hd">
        <span>选择时间段</span>
        <span class="close" onclick="hideFilterSheet()">×</span>
      </div>
      <div class="range-body">
        <div class="range-field">
          <label>开始日期</label>
          <input type="date" id="startDate">
        </div>
        <div class="range-field">
          <label>结束日期</label>
          <input type="date" id="endDate">
        </div>
        <div class="range-tip">可只选开始或结束日期查询单边时间段，留空则查询全部</div>
        <div class="range-ops">
          <div class="btn reset" onclick="resetRange()">重置</div>
          <div class="btn ok" onclick="applyRange()">确定</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* 业务员积分明细：仅有管理端/奖励发放（增加），无扣减记录
   offset 为距今天数，日期在渲染时按当前日期动态计算 */
const records=[
  {offset:0,time:'15:20:11',reason:'管理端发放积分',delta:500,balance:8600},
  {offset:0,time:'09:12:33',reason:'铺货达标奖励积分',delta:300,balance:8100},
  {offset:1,time:'17:42:08',reason:'推荐门店奖励积分',delta:800,balance:7800},
  {offset:2,time:'11:06:52',reason:'活动奖励积分',delta:600,balance:7000},
  {offset:3,time:'16:31:20',reason:'管理端发放积分',delta:1200,balance:6400},
  {offset:5,time:'10:48:07',reason:'任务完成奖励积分',delta:400,balance:5200},
  {offset:6,time:'14:05:39',reason:'铺货达标奖励积分',delta:900,balance:4800},
  {offset:12,time:'09:55:14',reason:'管理端发放积分',delta:1500,balance:3900},
  {offset:20,time:'15:22:46',reason:'推荐门店奖励积分',delta:1000,balance:2400},
  {offset:45,time:'13:18:02',reason:'活动奖励积分',delta:1400,balance:1400}
];
let startDate='',endDate='';

function pad(n){return String(n).padStart(2,'0');}
function dateFor(offset){
  const d=new Date();
  d.setDate(d.getDate()-offset);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function showFilterSheet(){document.getElementById('filterModal').classList.add('show');}
function hideFilterSheet(){document.getElementById('filterModal').classList.remove('show');}
function closeFilterModal(e){if(e.target.id==='filterModal')hideFilterSheet();}
function applyRange(){
  const s=document.getElementById('startDate').value||'';
  const e=document.getElementById('endDate').value||'';
  if(s&&e&&s>e){toast('开始日期不能晚于结束日期');return;}
  startDate=s;endDate=e;
  hideFilterSheet();
  render();
}
function resetRange(){
  document.getElementById('startDate').value='';
  document.getElementById('endDate').value='';
  startDate='';endDate='';
  hideFilterSheet();
  render();
}
function filterText(){
  if(startDate&&endDate)return startDate.slice(5)+' ~ '+endDate.slice(5);
  if(startDate)return startDate.slice(5)+' 起';
  if(endDate)return '截至 '+endDate.slice(5);
  return '全部时间';
}
function match(r){
  const d=dateFor(r.offset);
  if(startDate&&d<startDate)return false;
  if(endDate&&d>endDate)return false;
  return true;
}
function render(){
  const box=document.getElementById('content');
  const list=records.filter(match);
  const sum=list.reduce((s,r)=>s+r.delta,0);
  document.getElementById('filterText').textContent=filterText();
  const rangeTxt=(startDate||endDate)
    ? ((startDate||'不限')+' 至 '+(endDate||'不限')+' · ')
    : '';
  document.getElementById('summary').innerHTML=rangeTxt+'共 '+list.length+' 笔 · 累计增加 <b>'+sum.toLocaleString('en-US')+'</b> 积分';
  if(list.length===0){box.innerHTML='<div class="empty">该时间段暂无积分变动记录</div>';return;}
  box.innerHTML=list.map(r=>`
    <div class="rec">
      <div class="left">
        <div class="reason">${r.reason}</div>
        <div class="time">${dateFor(r.offset)} ${r.time}</div>
      </div>
      <div class="right">
        <div class="delta">+${r.delta.toLocaleString('en-US')}</div>
        <div class="bal">余额 ${r.balance.toLocaleString('en-US')}</div>
      </div>
    </div>`).join('');
}
let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script>
</body>
</html>
