<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 编辑地址</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:12px;padding-bottom:90px}

.form-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;overflow:hidden;margin-bottom:10px}
.form-row{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid rgba(0,0,0,.06)}
.form-row:last-child{border-bottom:none}
.form-row .label{width:90px;flex-shrink:0;font-size:14px;color:#333}
.form-row input{flex:1;border:none;outline:none;font-size:14px;color:#1a1a1a;background:transparent}
.form-row input::placeholder{color:#bbb}
.form-row .region{flex:1;font-size:14px;color:#1a1a1a;display:flex;align-items:center;justify-content:space-between}
.form-row .region.empty{color:#bbb}
.form-row .arrow{color:#999;font-size:14px}
.form-row textarea{flex:1;border:none;outline:none;font-size:14px;color:#1a1a1a;background:transparent;resize:none;height:60px;line-height:1.5;font-family:inherit}
.form-row textarea::placeholder{color:#bbb}

.default-row{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.default-row .label{font-size:14px;color:#333}
.switch{width:44px;height:24px;border-radius:999px;background:#ddd;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.switch.on{background:#c9302c}
.switch.on::after{transform:translateX(20px)}

.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:10px 12px;z-index:20}
.footer button{width:100%;height:44px;background:#c9302c;color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title" id="pageTitle">新增地址</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="content">
    <div class="form-card">
      <div class="form-row">
        <span class="label">收货人</span>
        <input type="text" id="name" placeholder="请输入收货人姓名" maxlength="20">
      </div>
      <div class="form-row">
        <span class="label">联系电话</span>
        <input type="tel" id="phone" placeholder="请输入联系电话" maxlength="11">
      </div>
      <div class="form-row" onclick="selectRegion()">
        <span class="label">所在地区</span>
        <div class="region empty" id="regionText">请选择省/市/区</div>
        <span class="arrow">›</span>
      </div>
      <div class="form-row">
        <span class="label">详细地址</span>
        <textarea id="detail" placeholder="请输入街道、门牌号等详细地址" maxlength="100"></textarea>
      </div>
    </div>

    <div class="default-row">
      <span class="label">设为默认地址</span>
      <div class="switch" id="defaultSwitch" onclick="toggleDefault()"></div>
    </div>
  </div>

  <div class="footer">
    <button onclick="saveAddress()">保存</button>
  </div>

<div class="toast" id="toast"></div>
</div>


<script>
let isDefault=false;
let editId=null;
let selectedRegion='';

function toggleDefault(){
  isDefault=!isDefault;
  document.getElementById('defaultSwitch').classList.toggle('on',isDefault);
}

function selectRegion(){
  // simulate region picker
  const regions=[
    '广东省 广州市 天河区',
    '广东省 深圳市 南山区',
    '广东省 佛山市 禅城区',
    '湖南省 长沙市 岳麓区',
    '浙江省 杭州市 西湖区'
  ];
  const r=regions[Math.floor(Math.random()*regions.length)];
  selectedRegion=r;
  const el=document.getElementById('regionText');
  el.textContent=r;
  el.classList.remove('empty');
}

function saveAddress(){
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const detail=document.getElementById('detail').value.trim();

  if(!name){toast('请输入收货人姓名');return;}
  if(!phone){toast('请输入联系电话');return;}
  if(!selectedRegion){toast('请选择所在地区');return;}
  if(!detail){toast('请输入详细地址');return;}

  const parts=selectedRegion.split(' ');
  toast(editId?'地址修改成功':'地址添加成功');
  setTimeout(()=>history.back(),800);
}

// init edit mode
(function init(){
  const params=new URLSearchParams(location.search);
  editId=params.get('id');
  if(editId){
    document.getElementById('pageTitle').textContent='编辑地址';
    // mock fill
    document.getElementById('name').value='张三';
    document.getElementById('phone').value='13888888888';
    document.getElementById('detail').value='科韵路 123 号某某大厦 18 楼';
    selectedRegion='广东省 广州市 天河区';
    const el=document.getElementById('regionText');
    el.textContent=selectedRegion;
    el.classList.remove('empty');
    isDefault=true;
    document.getElementById('defaultSwitch').classList.add('on');
  }
})();

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
