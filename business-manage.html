<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 业务管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.search{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.search input{flex:1;height:38px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none}
.search input:focus{border-color:#c9302c}
.search button{width:64px;height:38px;background:#c9302c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:80px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:flex-start}
.card .avatar{width:44px;height:44px;border-radius:50%;background:#fff7f7;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;margin-right:12px}
.card .main{flex:1;min-width:0}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .name{font-size:15px;font-weight:500}
.card .status{font-size:12px;padding:1px 7px;border-radius:4px}
.card .status.on{color:#2a9d4f;background:rgba(42,157,79,.1)}
.card .status.off{color:#999;background:#f2f2f2}
.card .info{font-size:13px;color:#666;line-height:1.8}
.card .info .label{color:#999}
.card .ops{display:flex;flex-direction:column;gap:8px;flex-shrink:0;margin-left:10px}
.card .ops button{height:28px;padding:0 12px;border:.5px solid rgba(0,0,0,.12);background:#fff;border-radius:6px;font-size:13px;color:#333;cursor:pointer}
.card .ops button.danger{color:#c9302c;border-color:rgba(201,48,44,.3)}

.fab{position:absolute;right:16px;bottom:24px;width:52px;height:52px;border-radius:50%;background:#c9302c;color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(201,48,44,.25)}
.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-panel{width:300px;background:#fff;border-radius:14px;padding:20px;text-align:center}
.modal-panel h3{font-size:16px;font-weight:600;margin-bottom:8px}
.modal-panel p{font-size:13px;color:#666;margin-bottom:18px;line-height:1.6}
.modal-panel .btns{display:flex;gap:10px}
.modal-panel .btns button{flex:1;height:40px;border-radius:8px;font-size:14px;cursor:pointer;border:none}
.modal-panel .btns .cancel{background:#f5f6f7;color:#333}
.modal-panel .btns .confirm{background:#c9302c;color:#fff}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">业务管理</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="search">
    <input type="text" id="kw" placeholder="请输入业务员姓名或联系电话" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>

  <div class="content" id="content"></div>

  <button class="fab" onclick="addSalesman()">+</button>

  <div class="modal" id="delModal" onclick="closeDel(event)">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <h3>确认删除</h3>
      <p id="delText">确定删除该业务员吗？删除后不可恢复。</p>
      <div class="btns">
        <button class="cancel" onclick="hideDel()">取消</button>
        <button class="confirm" onclick="confirmDel()">删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
let salesmen=[
  {id:1,name:'刘伟',phone:'138****6688',stores:12,status:'on',ctime:'2024-03-15'},
  {id:2,name:'陈静',phone:'139****7766',stores:8,status:'on',ctime:'2024-05-22'},
  {id:3,name:'赵磊',phone:'137****5522',stores:5,status:'off',ctime:'2023-11-08'},
  {id:4,name:'孙倩',phone:'136****3399',stores:7,status:'on',ctime:'2024-06-30'},
  {id:5,name:'周强',phone:'135****1144',stores:4,status:'on',ctime:'2024-08-12'},
  {id:6,name:'吴敏',phone:'134****2288',stores:6,status:'off',ctime:'2023-09-18'}
];
let delId=null;
let curKw='';

function render(kw){
  kw=(kw||'').trim().toLowerCase();
  curKw=kw;
  const box=document.getElementById('content');
  const list=salesmen.filter(s=>(s.name+s.phone).toLowerCase().includes(kw));
  if(list.length===0){box.innerHTML='<div class="empty">未找到匹配的业务员</div>';return;}
  box.innerHTML=list.map(s=>`
    <div class="card" data-id="${s.id}">
      <div class="avatar">${s.name.charAt(0)}</div>
      <div class="main">
        <div class="top">
          <span class="name">${s.name}</span>
          <span class="status ${s.status}">${s.status==='on'?'在职':'离职'}</span>
        </div>
        <div class="info">
          <div><span class="label">联系电话</span> ${s.phone}</div>
          <div><span class="label">门店数</span> ${s.stores}</div>
          <div><span class="label">创建时间</span> ${s.ctime}</div>
        </div>
      </div>
      <div class="ops">
        <button onclick="editSalesman(${s.id})">编辑</button>
        <button class="danger" onclick="delSalesman(${s.id})">删除</button>
      </div>
    </div>
  `).join('');
}

function doSearch(){render(document.getElementById('kw').value);}
function addSalesman(){toast('新增业务员（演示）');}
function editSalesman(id){toast('编辑业务员：'+salesmen.find(s=>s.id===id).name);}

function delSalesman(id){
  const s=salesmen.find(x=>x.id===id);
  if(!s)return;
  delId=id;
  document.getElementById('delText').textContent='确定删除业务员「'+s.name+'」吗？删除后不可恢复。';
  document.getElementById('delModal').classList.add('show');
}
function hideDel(){document.getElementById('delModal').classList.remove('show');delId=null;}
function closeDel(e){if(e.target.id==='delModal')hideDel();}
function confirmDel(){
  if(!delId)return;
  const idx=salesmen.findIndex(x=>x.id===delId);
  if(idx>-1)salesmen.splice(idx,1);
  hideDel();
  render(curKw);
  toast('业务员删除成功');
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

render();
</script>
</body>
</html>
