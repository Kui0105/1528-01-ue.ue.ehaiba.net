<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 积分商城</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#c9302c;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0;color:#fff}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #fff;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #fff;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#fff;border-radius:1px}
.navbar{height:44px;background:#c9302c;display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500;color:#fff}
.navbar .user-points{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;color:#fff}
.user-points .avatar{width:28px;height:28px;border-radius:50%;background:#fff;border:.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:12px;color:#c9302c;overflow:hidden}
.user-points .meta{display:flex;flex-direction:column;line-height:1.2}
.user-points .meta .label{font-size:10px;opacity:.9}
.user-points .meta .num{font-size:13px;font-weight:600}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(255,255,255,.35);border-radius:15px;display:flex;align-items:center;background:rgba(255,255,255,.15)}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px;color:#fff}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #fff;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(255,255,255,.35)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:12px;padding-bottom:80px}

/* search */
.search-bar{margin:0 12px 12px;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.search-bar .ic{width:16px;height:16px;border:1.5px solid #999;border-radius:50%;position:relative;flex-shrink:0}
.search-bar .ic::after{content:'';position:absolute;right:-4px;bottom:-4px;width:6px;height:1.5px;background:#999;transform:rotate(45deg)}
.search-bar .txt{font-size:14px;color:#999}

/* banner */
.banner-wrap{margin:0 12px 12px;border-radius:12px;overflow:hidden;position:relative;height:140px;border:.5px solid rgba(0,0,0,.08)}
.banner-track{display:flex;height:100%;transition:transform .35s ease}
.banner-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:500}
.banner-slide:nth-child(1){background:linear-gradient(135deg,#c9302c,#e8645f)}
.banner-slide:nth-child(2){background:linear-gradient(135deg,#d4a843,#f0c94d)}
.banner-slide:nth-child(3){background:linear-gradient(135deg,#42a5f5,#1565c0)}
.banner-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.banner-dots span.active{background:#fff}

/* quick nav */
.nav-section{margin:0 12px 12px;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px}
.nav-section .h{display:flex;justify-content:center;align-items:center;margin-top:10px}
.nav-section .h .dots{display:flex;gap:5px}
.nav-section .h .dots i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.15)}
.nav-section .h .dots i.active{background:#c9302c}
.nav-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-page{min-width:100%;display:grid;grid-template-columns:repeat(5,1fr);row-gap:14px;scroll-snap-align:start}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.nav-item .icon{width:44px;height:44px;border-radius:50%;background:#f5f6f7;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-item .name{font-size:12px;color:#333}

/* recommend list */
.rec-section{margin:0 12px}
.rec-section .h{font-size:15px;font-weight:500;margin-bottom:10px}
.rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rec-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;cursor:pointer}
.rec-card .img{aspect-ratio:1/1;background:#f5f6f7;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px}
.rec-card .info{padding:10px}
.rec-card .name{font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#999}
.rec-card .meta .pt{color:#c9302c;font-weight:600;font-size:13px}

/* exchange modal */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-panel .hd{display:flex;gap:12px;margin-bottom:16px}
.modal-panel .hd .img{width:80px;height:80px;background:#f5f6f7;border-radius:10px;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;flex-shrink:0}
.modal-panel .hd .meta{flex:1}
.modal-panel .hd .meta .name{font-size:15px;font-weight:500;margin-bottom:6px}
.modal-panel .hd .meta .price{font-size:13px;color:#c9302c;font-weight:600}
.modal-panel .hd .meta .orig{font-size:11px;color:#999;text-decoration:line-through;margin-left:6px}
.modal-panel .close{position:absolute;top:12px;right:16px;font-size:22px;color:#999;cursor:pointer}
.qty-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;padding:12px 0;border-top:.5px solid rgba(0,0,0,.08);border-bottom:.5px solid rgba(0,0,0,.08)}
.qty-row span{font-size:14px}
.qty-ctrl{display:flex;align-items:center;border:.5px solid rgba(0,0,0,.15);border-radius:6px;overflow:hidden}
.qty-ctrl button{width:34px;height:30px;background:#f5f6f7;border:none;font-size:16px;color:#333;cursor:pointer}
.qty-ctrl .num{width:44px;text-align:center;font-size:14px;font-weight:500}
.modal-btn{display:block;width:100%;background:#c9302c;color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:500;cursor:pointer}

/* tabbar */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;z-index:20}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab-item .ic{font-size:20px;color:#999}
.tab-item .txt{font-size:11px;color:#999}
.tab-item.active .ic,.tab-item.active .txt{color:#c9302c}

.scan-fab{position:absolute;right:16px;bottom:72px;width:52px;height:52px;border-radius:50%;background:#c9302c;color:#fff;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30}
.scan-fab svg{width:26px;height:26px;stroke:#fff}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <div class="user-points">
      <div class="avatar">👤</div>
      <div class="meta">
        <span class="label">我的积分</span>
        <span class="num" id="headerPoints">1,280</span>
      </div>
    </div>
    <span class="title">积分商城</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="content">
    <div class="search-bar" onclick="location.href='search.html'">
      <span class="ic"></span>
      <span class="txt">搜索积分商品</span>
    </div>

    <div class="banner-wrap">
      <div class="banner-track" id="bannerTrack">
        <div class="banner-slide">Banner 1</div>
        <div class="banner-slide">Banner 2</div>
        <div class="banner-slide">Banner 3</div>
      </div>
      <div class="banner-dots" id="bannerDots"></div>
    </div>

    <div class="nav-section">
      <div class="nav-scroll" id="navScroll">
        <div class="nav-page">
          <div class="nav-item" onclick="location.href='category.html?name=数码家电'"><div class="icon">🎁</div><div class="name">数码家电</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=食品生鲜'"><div class="icon">🍫</div><div class="name">食品生鲜</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=家居日用'"><div class="icon">🏠</div><div class="name">家居日用</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=美妆个护'"><div class="icon">💄</div><div class="name">美妆个护</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=服饰箱包'"><div class="icon">👕</div><div class="name">服饰箱包</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=母婴玩具'"><div class="icon">🧸</div><div class="name">母婴玩具</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=潮玩周边'"><div class="icon">🎮</div><div class="name">潮玩周边</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=卡券权益'"><div class="icon">🎫</div><div class="name">卡券权益</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=汽车用品'"><div class="icon">🚗</div><div class="name">汽车用品</div></div>
          <div class="nav-item" onclick="location.href='category.html?name=图书文具'"><div class="icon">📚</div><div class="name">图书文具</div></div>
        </div>
      </div>
      <div class="h"><div class="dots" id="navDots"><i class="active"></i><i></i></div></div>
    </div>

    <div class="rec-section">
      <div class="h">推荐兑换</div>
      <div class="rec-grid" id="recGrid"></div>
    </div>
  </div>

  <!-- exchange modal removed: list now jumps to goods detail page -->

  <div class="tabbar">
    <div class="tab-item active" onclick="toast('当前在积分商城首页')">
      <div class="ic">🏠</div>
      <div class="txt">首页</div>
    </div>
    <div class="tab-item" onclick="location.href='profile.html'">
      <div class="ic">👤</div>
      <div class="txt">我的</div>
    </div>
  </div>

  <div class="scan-fab" onclick="doScan()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <path d="M7 7h3v3H7z"></path>
      <path d="M14 7h3v3h-3z"></path>
      <path d="M7 14h3v3H7z"></path>
      <path d="M3 12h18"></path>
    </svg>
  </div>
</div>

<script>
const myPoints=1280;
document.getElementById('headerPoints').textContent=myPoints.toLocaleString();

const goods=[
  {name:'迈极炫定制打火机',points:500,orig:'¥39.90',ex:128},
  {name:'便携收纳盒',points:300,orig:'¥19.90',ex:86},
  {name:'品牌毛巾套装',points:800,orig:'¥59.00',ex:45},
  {name:'迈极炫帆布袋',points:450,orig:'¥29.90',ex:72},
  {name:'迷你蓝牙音箱',points:1500,orig:'¥129.00',ex:23},
  {name:'品牌钥匙扣',points:200,orig:'¥9.90',ex:210}
];

const grid=document.getElementById('recGrid');
goods.forEach((g,i)=>{
  const el=document.createElement('div');
  el.className='rec-card';
  el.onclick=()=>location.href='goods-detail.html?id='+i;
  el.innerHTML=`<div class="img">商品图</div><div class="info"><div class="name">${g.name}</div><div class="meta"><span class="pt">${g.points} 积分</span><span>已兑 ${g.ex}</span></div>
<div class="toast" id="toast"></div>
</div>`;
  grid.appendChild(el);
});

// banner autoplay 2s
let cur=0;
const track=document.getElementById('bannerTrack');
const dots=document.getElementById('bannerDots');
for(let i=0;i<3;i++){const d=document.createElement('span');if(i===0)d.className='active';dots.appendChild(d);}
function setBanner(i){
  cur=i;
  track.style.transform=`translateX(-${i*100}%)`;
  Array.from(dots.children).forEach((c,idx)=>c.classList.toggle('active',idx===i));
}
setInterval(()=>setBanner((cur+1)%3),2000);

// nav pagination dots
const navScroll=document.getElementById('navScroll');
const navDots=document.getElementById('navDots');
navScroll.addEventListener('scroll',()=>{
  const page=Math.round(navScroll.scrollLeft/(navScroll.clientWidth-1));
  Array.from(navDots.children).forEach((d,i)=>d.classList.toggle('active',i===page));
});

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

function doScan(){
  location.href='p1-scan.html?from=mall';
}
</script>
</body>
</html>
