<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 销售明细</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.search{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.search input{flex:1;height:38px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none}
.search input:focus{border-color:#c9302c}
.search button{width:64px;height:38px;background:#c9302c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.filter-row{padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.filter-row select{width:100%;height:38px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .batch{font-size:14px;font-weight:500;color:#333}
.card .status{font-size:12px;padding:2px 8px;border-radius:4px}
.card .status.activated{color:#2a9d4f;background:rgba(42,157,79,.1)}
.card .status.pending_prize{color:#e6a23c;background:rgba(230,162,60,.1)}
.card .status.pending_verify{color:#9b59b6;background:rgba(155,89,182,.1)}
.card .status.completed{color:#666;background:#f2f2f2}
.card .rows{font-size:13px;color:#666;line-height:1.9}
.card .rows .row{display:flex}
.card .rows .row .k{width:72px;color:#999;flex-shrink:0}
.card .rows .row .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">销售明细</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="search">
    <input type="text" id="kw" placeholder="搜索门店/业务员/商品名称" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>

  <div class="filter-row">
    <select id="statusFilter" onchange="doSearch()">
      <option value="">全部状态</option>
      <option value="activated">已激活</option>
      <option value="pending_prize">待兑奖</option>
      <option value="pending_verify">待核销</option>
      <option value="completed">已完成</option>
    </select>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
const products=['迈极炫槟榔 20元装','迈极炫槟榔 50元装','迈极炫槟榔 100元装','迈极炫礼盒套装'];
const stores=['湘江东路店','五一广场店','岳麓山北店','万家丽店','德思勤店'];
const salesmen=['刘伟','陈静','赵磊','孙倩','周强','吴敏'];
const statuses=['activated','pending_prize','pending_verify','completed'];
const statusMap={
  activated:'已激活',
  pending_prize:'待兑奖',
  pending_verify:'待核销',
  completed:'已完成'
};
const sales=Array.from({length:18},(_,i)=>{
  const id=i+1;
  const batch='PC'+('20260827'+String(id).padStart(3,'0'));
  const code='JM'+String(id).padStart(6,'0');
  const product=products[i%products.length];
  const store=stores[i%stores.length];
  const salesman=salesmen[i%salesmen.length];
  const status=statuses[i%statuses.length];
  const total='第'+(i+1)+'批次';
  const date=new Date(2026,7,27-Math.floor(i/3));
  const valid=new Date(date.getFullYear()+1,date.getMonth(),date.getDate());
  const ctime=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(8+i%12).padStart(2,'0')}:${String((i*7)%60).padStart(2,'0')}`;
  return {id,total,batch,code,valid:fmtDate(valid),store,salesman,name:product,status,ctime};
});

function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function render(kw,status){
  kw=(kw||'').trim().toLowerCase();
  status=status||'';
  const box=document.getElementById('content');
  let list=sales.filter(s=>{
    const matchKw=(s.store+s.salesman+s.name+s.batch+s.code).toLowerCase().includes(kw);
    const matchStatus=!status||s.status===status;
    return matchKw&&matchStatus;
  });
  if(list.length===0){box.innerHTML='<div class="empty">未找到匹配的销售记录</div>';return;}
  box.innerHTML=list.map(s=>`
    <div class="card">
      <div class="top">
        <span class="batch">批次号：${s.batch}</span>
        <span class="status ${s.status}">${statusMap[s.status]}</span>
      </div>
      <div class="rows">
        <div class="row"><span class="k">总批次</span><span class="v">${s.total}</span></div>
        <div class="row"><span class="k">奖码ID</span><span class="v">${s.code}</span></div>
        <div class="row"><span class="k">有效期</span><span class="v">${s.valid}</span></div>
        <div class="row"><span class="k">销售门店</span><span class="v">${s.store}</span></div>
        <div class="row"><span class="k">业务员</span><span class="v">${s.salesman}</span></div>
        <div class="row"><span class="k">商品名称</span><span class="v">${s.name}</span></div>
        <div class="row"><span class="k">激活时间</span><span class="v">${s.ctime}</span></div>
      </div>
    </div>`).join('');
}
function doSearch(){
  render(document.getElementById('kw').value,document.getElementById('statusFilter').value);
}
render();
</script>
</body>
</html>
