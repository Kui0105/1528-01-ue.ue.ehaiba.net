<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · P1 扫码结果页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
/* status bar */
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
/* nav bar */
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .home{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#1a1a1a}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
/* full screen poster */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.poster{position:absolute;inset:0}
.poster-img{width:100%;height:100%;background:linear-gradient(155deg,#c9302c,#e8645f);display:flex;align-items:center;justify-content:center;color:#fff}
.poster-content{text-align:center;padding:48px 28px;width:100%}
.poster-brand{font-size:34px;font-weight:600;letter-spacing:4px;margin-bottom:12px}
.poster-slogan{font-size:15px;opacity:.92;margin-bottom:48px;letter-spacing:1px}
.lottery-btn{display:inline-block;background:#d4a843;color:#fff;padding:14px 64px;border-radius:999px;font-size:18px;font-weight:500;cursor:pointer;border:none;transition:transform .12s}
.lottery-btn:active{transform:scale(.96)}
/* auth modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:28px 24px;width:84%;max-width:320px;text-align:center}
.modal h3{font-size:16px;font-weight:500;margin-bottom:8px}
.modal p{font-size:13px;color:#666;margin-bottom:22px;line-height:1.6}
.modal .btn{width:100%;height:42px;background:#d4a843;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer}
.modal .cancel{margin-top:10px;width:100%;height:38px;background:transparent;color:#999;border:.5px solid rgba(0,0,0,.12);border-radius:10px;font-size:13px;cursor:pointer}
/* toast */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar">
    <span>10:25</span>
    <span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span>
  </div>
  <div class="navbar">
    <span class="home" title="返回首页" onclick="location.href='home.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </span>
    <span class="title">迈极炫</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>
  <div class="content">
    <div class="poster">
      <div class="poster-img">
        <div class="poster-content">
          <div class="poster-brand">迈极炫</div>
          <div class="poster-slogan">扫码赢好礼 · 即刻开抽</div>
          <button class="lottery-btn" onclick="onLottery()">立即抽奖</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="authOverlay">
  

<div class="toast" id="toast">
<div class="modal">
    <h3>需要登录</h3>
    <p>检测到您尚未登录，请授权微信手机号后继续抽奖</p>
    <button class="btn" onclick="doAuth()">微信手机号一键登录</button>
    <button class="cancel" onclick="closeAuth()">暂不登录</button>
  </div>
</div>
</div>


<script>
let loggedIn=false;
function onLottery(){
  if(!loggedIn){ document.getElementById('authOverlay').classList.add('show'); }
  else { location.href='p2-verify.html'; }
}
function closeAuth(){ document.getElementById('authOverlay').classList.remove('show'); }
function doAuth(){
  closeAuth(); loggedIn=true; toast('登录成功');
  setTimeout(()=>location.href='p2-verify.html',600);
}
let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
