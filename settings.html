<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 个人设置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding-top:10px;padding-bottom:90px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;margin:0 12px 10px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border-bottom:.5px solid rgba(0,0,0,.06);cursor:pointer}
.row:last-child{border-bottom:none}
.row .label{font-size:14px;color:#333}
.row .right{display:flex;align-items:center;gap:8px;min-width:0}
.row .value{font-size:14px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .arrow{color:#999;font-size:16px}
.row .avatar{width:40px;height:40px;border-radius:50%;background:#f5f6f7;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}

.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:10px 12px;z-index:20}
.footer .save{width:100%;background:#c9302c;color:#fff;border:none;border-radius:999px;padding:12px;font-size:15px;font-weight:500;cursor:pointer}
.footer .save:active{opacity:.9}

/* modal */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:300px;background:#fff;border-radius:12px;padding:20px}
.modal-panel h3{font-size:16px;font-weight:500;margin-bottom:16px;text-align:center}
.modal-panel input{width:100%;height:40px;border:1px solid rgba(0,0,0,.15);border-radius:8px;padding:0 12px;font-size:14px;outline:none}
.modal-panel .btns{display:flex;gap:10px;margin-top:20px}
.modal-panel .btns button{flex:1;height:38px;border-radius:999px;border:none;font-size:14px;cursor:pointer}
.modal-panel .btns .cancel{background:#f5f6f7;color:#666}
.modal-panel .btns .confirm{background:#c9302c;color:#fff}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">个人设置</span>
  </div>

  <div class="content">
    <div class="card">
      <div class="row" onclick="changeAvatar()">
        <span class="label">用户头像</span>
        <div class="right">
          <div class="avatar" id="userAvatar">👤</div>
          <span class="arrow">›</span>
        </div>
      </div>
      <div class="row" onclick="editNickname()">
        <span class="label">用户昵称</span>
        <div class="right">
          <span class="value" id="userNickname">微信用户_abc123</span>
          <span class="arrow">›</span>
        </div>
      </div>
      <div class="row" onclick="rebindPhone()">
        <span class="label">手机号码</span>
        <div class="right">
          <span class="value" id="userPhone">138****8888</span>
          <span class="arrow">›</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row" onclick="location.href='agreement.html'">
        <span class="label">用户协议</span>
        <div class="right">
          <span class="arrow">›</span>
        </div>
      </div>
      <div class="row" onclick="location.href='privacy.html'">
        <span class="label">隐私政策</span>
        <div class="right">
          <span class="arrow">›</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="save" onclick="doSave()">保存</button>
  </div>

  <div class="modal" id="nickModal" onclick="closeModal(event)">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <h3>修改昵称</h3>
      <input type="text" id="nickInput" placeholder="请输入昵称" maxlength="20">
      <div class="btns">
        <button class="cancel" onclick="hideModal()">取消</button>
        <button class="confirm" onclick="confirmNickname()">确定</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- nickname modal -->



<script>
function changeAvatar(){
  toast('授权微信头像 / 本地上传');
}
function editNickname(){
  const current=document.getElementById('userNickname').textContent;
  document.getElementById('nickInput').value=current;
  document.getElementById('nickModal').classList.add('show');
}
function confirmNickname(){
  const v=document.getElementById('nickInput').value.trim();
  if(!v){toast('昵称不能为空');return;}
  document.getElementById('userNickname').textContent=v;
  hideModal();
  toast('昵称已修改，请保存');
}
function hideModal(){document.getElementById('nickModal').classList.remove('show');}
function closeModal(e){if(e.target.id==='nickModal')hideModal();}
function rebindPhone(){
  toast('重新授权微信绑定的手机号码');
}
function doSave(){
  toast('保存成功');
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
