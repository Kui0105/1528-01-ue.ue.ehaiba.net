html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}

.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;height:38px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fff;outline:none}
.search-bar input::placeholder{color:#bbb}
.search-bar button{height:38px;padding:0 16px;border:none;border-radius:8px;background:#c9302c;color:#fff;font-size:14px;cursor:pointer}

.dealer-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.dealer-card .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.dealer-card .name{font-size:15px;font-weight:500;line-height:1.4;flex:1;margin-right:8px}
.dealer-card .status{font-size:12px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.dealer-card .status.enabled{color:#2a9d4f;background:rgba(42,157,79,.1)}
.dealer-card .status.disabled{color:#999;background:#f2f2f2}
.dealer-card .info{font-size:13px;color:#666;line-height:1.9}
.dealer-card .info .row{display:flex}
.dealer-card .info .label{color:#999;min-width:72px}
.dealer-card .info .value{flex:1}
.dealer-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:.5px solid rgba(0,0,0,.06)}
.dealer-card .stats{display:flex;gap:16px}
.dealer-card .stats .item{font-size:12px;color:#666}
.dealer-card .stats .item b{color:#c9302c;margin-right:2px}
.dealer-card .view{height:28px;padding:0 14px;border:.5px solid #c9302c;border-radius:6px;background:#fff;color:#c9302c;font-size:13px;cursor:pointer}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}

let currentList=allDealers[regionId]||[];

function render(list){
  const box=document.getElementById('listBox');
  if(!list) list=currentList;
  if(list.length===0){box.innerHTML='<div class="empty">暂无经销商数据</div>';return;}
  box.innerHTML=list.map(d=>`
    <div class="dealer-card">
      <div class="head">
        <div class="name">${d.name}</div>
        <span class="status ${d.status}">${d.status==='enabled'?'启用':'禁用'}</span>
      </div>
      <div class="info">
        <div class="row"><span class="label">联系人</span><span class="value">${d.contact}</span></div>
        <div class="row"><span class="label">联系电话</span><span class="value">${d.phone}</span></div>
        <div class="row"><span class="label">省市</span><span class="value">${d.province}${d.city}</span></div>
        <div class="row"><span class="label">销售区域</span><span class="value">${d.city}${d.area}</span></div>
      </div>
      <div class="foot">
        <div class="stats">
          <div class="item"><b>${d.sales}</b>业务员</div>
          <div class="item"><b>${d.stores}</b>门店</div>
        </div>
        <button class="view" onclick="viewDealer(${d.id})">查看</button>
      </div>
    </div>
  `).join('');
}

function search(){
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  if(!kw){render(currentList);return;}
  const filtered=currentList.filter(d=>
    d.name.toLowerCase().includes(kw)||
    d.contact.toLowerCase().includes(kw)||
    d.phone.includes(kw)
  );
  render(filtered);
}

function viewDealer(id){
  location.href='dealer-detail.html?id='+id;
}

document.getElementById('kw').addEventListener('keydown',function(e){
  if(e.key==='Enter') search();
});

render();
