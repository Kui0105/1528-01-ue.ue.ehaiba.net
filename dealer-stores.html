<!DOCTYPE html>

<title>迈极炫 · 门店数据</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.subbar{height:38px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 14px;font-size:13px;color:#666;flex-shrink:0}
.search{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.search input{flex:1;height:36px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none}
.search input:focus{border-color:#c9302c}
.search button{width:60px;height:36px;background:#c9302c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.card .name{font-size:15px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.card .status{font-size:12px;padding:2px 8px;border-radius:4px}
.card .status.open{color:#2a9d4f;background:rgba(42,157,79,.1)}
.card .status.stop{color:#999;background:#f2f2f2}
.card .info{font-size:13px;color:#666;line-height:1.8}
.card .info .label{color:#999;min-width:56px;display:inline-block}
.card .stock-row{display:flex;align-items:center;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:.5px solid rgba(0,0,0,.06);cursor:pointer}
.card .stock-row .label{color:#999}
.card .stock-row .stval{display:flex;align-items:center;gap:6px;color:#c9302c;font-weight:600}
.card .stock-row .arrow{color:#999;font-size:16px}
.stats-line{display:flex;margin-top:9px;padding-top:9px;border-top:.5px solid rgba(0,0,0,.06)}
.stats-line .col{flex:1;text-align:center}
.stats-line .col+.col{border-left:.5px solid rgba(0,0,0,.06)}
.stats-line .col .v{font-size:16px;font-weight:600;color:#c9302c}
.stats-line .col .t{font-size:12px;color:#999;margin-top:2px}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}
</style>

function genSalesman(i){return salesmen[i%salesmen.length];}
function genCtime(seed){
  const base=new Date(2024,0,1).getTime();
  const off=((seed*37)%520)*86400000;
  const d=new Date(base+off);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function render(kw){
  kw=(kw||'').trim().toLowerCase();
  const box=document.getElementById('content');
  const dname=dealerName[id]||'该经销商';
  document.getElementById('subbar').textContent=dname+' · 门店列表';
  let list=allStores[id]||[];
  if(kw){
    list=list.filter(s=>(s.name+s.contact+s.phone).toLowerCase().includes(kw));
  }
  if(list.length===0){box.innerHTML='<div class="empty">未找到匹配的门店</div>';return;}
  box.innerHTML=list.map((s,i)=>{
    const st=genStats(i);
    return `
    <div class="card">
      <div class="name">${s.name}<span class="status ${s.status}">${s.status==='open'?'营业中':'停业中'}</span></div>
      <div class="info">
        <div><span class="label">联系人</span>${s.contact}</div>
        <div><span class="label">联系电话</span>${s.phone}</div>
        <div><span class="label">业务员</span>${genSalesman(i)}</div>
        <div><span class="label">详细地址</span>${s.addr}</div>
        <div><span class="label">创建时间</span>${genCtime(id*200+i)}</div>
      </div>
      <div class="stats-line">
        <div class="col"><div class="v">${st.act}</div><div class="t">激活量</div></div>
        <div class="col"><div class="v">${st.dyn}</div><div class="t">动销量</div></div>
        <div class="col"><div class="v">${st.win}</div><div class="t">中奖量</div></div>
      </div>
      <div class="stock-row" onclick="goStock(${i})">
        <span class="label">库存总数</span>
        <span class="stval">${genTotal(i)} 件<span class="arrow">›</span></span>
      </div>
    </div>`;
  }).join('');

function genTotal(i){
  return (id%7+i*13)%180+42;
}
function genStats(i){
  return {
    act:(id%5+i*11)%260+25,
    dyn:(id%4+i*6)%210+18,
    win:(id%3+i*3)%55+4
  };
}

function goStock(i){
  location.href='dealer-store-stock.html?dealerId='+id+'&idx='+i+'&name='+encodeURIComponent((allStores[id]||[])[i].name);
}

function doSearch(){
  render(document.getElementById('kw').value);
}
