<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 消息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#c9302c;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0;color:#fff}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #fff;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #fff;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#fff;border-radius:1px}
.navbar{height:44px;background:#c9302c;display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500;color:#fff}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(255,255,255,.35);border-radius:15px;display:flex;align-items:center;background:rgba(255,255,255,.15)}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px;color:#fff}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #fff;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(255,255,255,.35)}

.tabs{display:flex;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);flex-shrink:0}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666;position:relative;cursor:pointer}
.tab.active{color:#c9302c;font-weight:500}
.tab.active::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:#c9302c;border-radius:2px}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:10px 12px;padding-bottom:72px}

.msg-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.msg-card .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.msg-card .title{font-size:15px;font-weight:500;color:#1a1a1a;line-height:1.4;flex:1;padding-right:12px}
.msg-card .badge{flex-shrink:0;min-width:18px;height:18px;padding:0 5px;background:#c9302c;color:#fff;border-radius:9px;font-size:11px;display:flex;align-items:center;justify-content:center}
.msg-card .desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:8px}
.msg-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999}
.msg-card .meta .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px}
.msg-card .meta .tag.pay{color:#c9302c;background:rgba(201,48,44,.08)}
.msg-card .meta .tag.paid{color:#07c160;background:rgba(7,193,96,.08)}
.msg-card .meta .tag.ship{color:#ff8a00;background:rgba(255,138,0,.08)}
.msg-card .meta .tag.warn{color:#ff8a00;background:rgba(255,138,0,.08)}

.warn-card .head{margin-bottom:10px}
.warn-card .store{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:6px}
.warn-card .info{font-size:13px;color:#666;line-height:1.6;margin-bottom:10px}
.warn-card .info b{color:#c9302c;font-weight:500}
.warn-card .progress{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-bottom:8px}
.warn-card .progress .bar{height:100%;background:#ff8a00;border-radius:3px}
.warn-card .footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999}
.warn-card .footer .action{color:#c9302c;font-weight:500}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center}
.empty-state .ic{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:15px;font-weight:500;color:#666;margin-bottom:6px}
.empty-state p{font-size:13px;color:#999}

/* tabbar */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;z-index:20}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab-item .ic{font-size:20px;color:#999;position:relative}
.tab-item .txt{font-size:11px;color:#999}
.tab-item.active .ic,.tab-item.active .txt{color:#c9302c}
.tab-item .dot{position:absolute;top:-2px;right:-6px;min-width:14px;height:14px;padding:0 3px;background:#c9302c;color:#fff;border-radius:7px;font-size:9px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="title">消息</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-type="order" onclick="setTab('order')">订单消息</div>
    <div class="tab" data-type="warn" onclick="setTab('warn')">预警消息</div>
  </div>

  <div class="content" id="content"></div>

  <div class="tabbar">
    <div class="tab-item" onclick="location.href='mall-home.html'">
      <div class="ic">🏠</div>
      <div class="txt">首页</div>
    </div>
    <div class="tab-item active" onclick="toast('当前在消息页面')">
      <div class="ic">💬<span class="dot">3</span></div>
      <div class="txt">消息</div>
    </div>
    <div class="tab-item" onclick="location.href='profile.html'">
      <div class="ic">👤</div>
      <div class="txt">我的</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const orderMsgs=[
  {id:1,type:'pay',tag:'待支付',title:'您有一笔订单待支付',desc:'迈极炫定制打火机 x1，共需 500 积分 + ¥6.00 运费，请于 30 分钟内完成支付。',time:'10分钟前',unread:true},
  {id:2,type:'paid',tag:'已支付',title:'订单支付成功',desc:'您的订单 XJM20260827001 已支付成功，商家将尽快为您发货。',time:'35分钟前',unread:true},
  {id:3,type:'ship',tag:'已发货',title:'订单已发货',desc:'您的订单 XJM20260826003 已由顺丰速运发出，运单号 SF1234567890。',time:'昨天 18:20',unread:true},
  {id:4,type:'paid',tag:'已支付',title:'订单支付成功',desc:'您的订单 XJM20260825004 已支付成功，等待商家发货。',time:'08-25 14:12',unread:false},
  {id:5,type:'ship',tag:'已发货',title:'订单已发货',desc:'您的订单 XJM20260824005 已发货，请注意查收。',time:'08-24 11:05',unread:false}
];

const warnMsgs=[
  {id:1,store:'天河路旗舰店',goods:'迈极炫定制打火机',stock:3,threshold:10,total:120,time:'10分钟前'},
  {id:2,store:'珠江新城专卖店',goods:'迈极炫帆布袋',stock:5,threshold:20,total:80,time:'1小时前'},
  {id:3,store:'番禺广场体验店',goods:'便携收纳盒',stock:2,threshold:15,total:60,time:'昨天 16:45'},
  {id:4,store:'白云万达专柜',goods:'品牌毛巾套装',stock:8,threshold:30,total:150,time:'08-25 09:30'}
];

let current='order';

function setTab(type){
  current=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.type===type));
  render();
}

function render(){
  const c=document.getElementById('content');
  if(current==='order') renderOrder(c);
  else renderWarn(c);
}

function renderOrder(c){
  if(!orderMsgs.length){
    c.innerHTML=`<div class="empty-state"><div class="ic">📭</div><h3>暂无订单消息</h3><p>订单相关通知将显示在这里</p></div>`;
    return;
  }
  c.innerHTML=orderMsgs.map(m=>`
    <div class="msg-card" onclick="goOrder('${m.type}',${m.id})">
      <div class="head">
        <div class="title">${m.title}</div>
        ${m.unread?'<span class="badge"></span>':''}
      </div>
      <div class="desc">${m.desc}</div>
      <div class="meta">
        <span class="tag ${m.type}">${m.tag}</span>
        <span>${m.time}</span>
      </div>
    </div>
  `).join('');
}

function renderWarn(c){
  if(!warnMsgs.length){
    c.innerHTML=`<div class="empty-state"><div class="ic">📭</div><h3>暂无预警消息</h3><p>门店库存预警将显示在这里</p></div>`;
    return;
  }
  c.innerHTML=warnMsgs.map(m=>{
    const pct=Math.min(100,Math.round(m.stock/m.total*100));
    return `
    <div class="msg-card warn-card" onclick="goWarn(${m.id})">
      <div class="head">
        <div>
          <div class="store">${m.store}</div>
          <div class="info"><b>库存预警</b>：${m.goods} 库存不足，请及时补充库存</div>
        </div>
        <span class="tag warn">库存不足</span>
      </div>
      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      <div class="footer">
        <span>当前库存 ${m.stock} / 预警阈值 ${m.threshold}</span>
        <span class="action">去补货 ›</span>
      </div>
    </div>
  `}).join('');
}

function goOrder(type,id){
  if(type==='pay') location.href='orders.html?tab=pay';
  else if(type==='paid') location.href='orders.html?tab=ship';
  else if(type==='ship') location.href='orders.html?tab=receive';
}
function goWarn(id){toast('跳转门店库存补货页面');}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

render();
</script>
</body>
</html>
