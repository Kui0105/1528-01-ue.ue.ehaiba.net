<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 我的订单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden;position:relative}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}

.tabs{display:flex;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex-shrink:0}
.tab{flex:1;min-width:64px;text-align:center;padding:12px 0;font-size:13px;color:#666;position:relative;cursor:pointer;white-space:nowrap}
.tab.active{color:#c9302c;font-weight:500}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:#c9302c;border-radius:2px}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:10px 12px}

.order-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.order-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-card .no{font-size:12px;color:#999}
.order-card .status{font-size:13px;color:#c9302c;font-weight:500}
.order-card .status.grey{color:#999}
.order-card .status.orange{color:#ff8a00}
.order-card .status.green{color:#07c160}

.goods{display:flex;gap:10px;margin-bottom:10px}
.goods .img{width:70px;flex-shrink:0;aspect-ratio:1/1;background:#f5f6f7;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;overflow:hidden}
.goods .info{flex:1;min-width:0}
.goods .name{font-size:14px;font-weight:500;color:#1a1a1a;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goods .meta{font-size:12px;color:#666}
.goods .meta span{margin-right:10px}

.total{text-align:right;font-size:13px;color:#666;margin-bottom:10px}
.total .num{color:#c9302c;font-weight:600}

.actions{display:flex;justify-content:flex-end;gap:8px}
.actions button{padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;border:none}
.actions .primary{background:#c9302c;color:#fff}
.actions .plain{background:#fff;color:#666;border:.5px solid rgba(0,0,0,.15)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center}
.empty-state .ic{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:15px;font-weight:500;color:#666;margin-bottom:6px}
.empty-state p{font-size:13px;color:#999}

/* confirm modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:280px;background:#fff;border-radius:12px;padding:20px;text-align:center}
.modal-panel h3{font-size:16px;font-weight:500;margin-bottom:10px}
.modal-panel p{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px}
.modal-panel .btns{display:flex;gap:10px}
.modal-panel .btns button{flex:1;height:38px;border-radius:999px;border:none;font-size:14px;cursor:pointer}
.modal-panel .btns .cancel{background:#f5f6f7;color:#666}
.modal-panel .btns .confirm{background:#c9302c;color:#fff}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">我的订单</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-status="all" onclick="setTab('all')">全部</div>
    <div class="tab" data-status="pending" onclick="setTab('pending')">待付款</div>
    <div class="tab" data-status="shipped" onclick="setTab('shipped')">待发货</div>
    <div class="tab" data-status="receipt" onclick="setTab('receipt')">待收货</div>
    <div class="tab" data-status="completed" onclick="setTab('completed')">已完成</div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <h3 id="modalTitle">提示</h3>
    <p id="modalText">确认操作？</p>
    <div class="btns">
      <button class="cancel" onclick="hideModal()">取消</button>
      <button class="confirm" id="modalConfirm" onclick="confirmAction()">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const statusMap={
  pending:{label:'待付款',cls:''},
  shipped:{label:'待发货',cls:'orange'},
  receipt:{label:'待收货',cls:'orange'},
  completed:{label:'已完成',cls:'green'},
  cancelled:{label:'已取消',cls:'grey'}
};
let orders=[
  {id:'XJM20260827001',status:'pending',name:'迈极炫定制打火机',points:500,qty:1,pay:6.00,time:'2026-08-27 10:23:45'},
  {id:'XJM20260827002',status:'shipped',name:'迈极炫品牌数据线',points:300,qty:2,pay:6.00,time:'2026-08-27 09:15:22'},
  {id:'XJM20260827003',status:'receipt',name:'迈极炫零食大礼包',points:800,qty:1,pay:6.00,time:'2026-08-26 18:40:11'},
  {id:'XJM20260827004',status:'completed',name:'迈极炫保温杯',points:1200,qty:1,pay:6.00,time:'2026-08-25 14:12:33'},
  {id:'XJM20260827005',status:'cancelled',name:'迈极炫充电宝',points:2500,qty:1,pay:0,time:'2026-08-25 11:05:09'}
];
const tabMap={pay:'pending',ship:'shipped',receive:'receipt',done:'completed'};
let currentTab='all';
let modalAction=null,modalOrderId=null;

(function init(){
  const params=new URLSearchParams(location.search);
  const t=params.get('tab');
  if(t && (tabMap[t] || t==='all')) currentTab=tabMap[t]||t;
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.status===currentTab));
})();

function setTab(status){
  currentTab=status;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.status===status));
  render();
}

function render(){
  const list=currentTab==='all'?orders:orders.filter(o=>o.status===currentTab);
  const c=document.getElementById('content');
  if(!list.length){
    c.innerHTML=`<div class="empty-state"><div class="ic">📝</div><h3>暂无订单</h3><p>该状态下没有订单</p></div>`;
    return;
  }
  c.innerHTML=list.map(o=>`
    <div class="order-card" onclick="location.href='order-detail.html?id=${o.id}'">
      <div class="head">
        <span class="no">订单号：${o.id}</span>
        <span class="status ${statusMap[o.status].cls}">${statusMap[o.status].label}</span>
      </div>
      <div class="goods">
        <div class="img">商品图</div>
        <div class="info">
          <div class="name">${o.name}</div>
          <div class="meta"><span>${o.points} 积分</span><span>x${o.qty}</span></div>
        </div>
      </div>
      <div class="total">实付：<span class="num">¥${o.pay.toFixed(2)}</span>（含运费）</div>
      <div class="actions" onclick="event.stopPropagation()">
        ${actionButtons(o)}
      </div>
    </div>
  `).join('');
}

function actionButtons(o){
  if(o.status==='pending'){
    return `<button class="plain" onclick="showCancel('${o.id}')">取消支付</button><button class="primary" onclick="doPay('${o.id}')">立即支付</button>`;
  }
  if(o.status==='shipped'){
    return `<button class="primary" onclick="location.href='order-detail.html?id=${o.id}'">查看详情</button>`;
  }
  if(o.status==='receipt'){
    return `<button class="plain" onclick="viewLogistics('${o.id}')">查看物流</button><button class="primary" onclick="showReceipt('${o.id}')">确认收货</button>`;
  }
  if(o.status==='completed'){
    return `<button class="plain" onclick="location.href='order-detail.html?id=${o.id}'">查看详情</button><button class="primary" onclick="contactService('${o.id}')">联系客服</button>`;
  }
  return `<button class="plain" onclick="location.href='order-detail.html?id=${o.id}'">查看详情</button>`;
}

function showCancel(id){
  modalOrderId=id;modalAction='cancel';
  document.getElementById('modalTitle').textContent='取消订单';
  document.getElementById('modalText').textContent='确认取消该订单？取消后积分将立即退回。';
  document.getElementById('modal').classList.add('show');
}
function showReceipt(id){
  modalOrderId=id;modalAction='receipt';
  document.getElementById('modalTitle').textContent='确认收货';
  document.getElementById('modalText').textContent='确认已收到商品？确认后订单将标记为已完成。';
  document.getElementById('modal').classList.add('show');
}
function hideModal(){document.getElementById('modal').classList.remove('show');}
function closeModal(e){if(e.target.id==='modal')hideModal();}
function confirmAction(){
  const o=orders.find(x=>x.id===modalOrderId);
  if(!o)return;
  if(modalAction==='cancel'){o.status='cancelled';toast('订单已取消，积分已退回');}
  if(modalAction==='receipt'){o.status='completed';toast('确认收货成功');}
  hideModal();render();
}
function doPay(id){toast('调用微信支付订单 '+id);}
function viewLogistics(id){location.href='logistics.html?id='+id;}
function contactService(id){toast('跳转官方在线客服');}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

render();
</script>
</body>
</html>
