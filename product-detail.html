<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 产品明细</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.filter-bar{display:flex;gap:10px;margin-bottom:12px}
.filter-item{flex:1;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.filter-item .label{font-size:12px;color:#999;margin-bottom:2px}
.filter-item .value{font-size:14px;color:#333}
.filter-item svg{width:14px;height:14px;color:#999;flex-shrink:0}

.record-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px;margin-bottom:10px}
.record-card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.record-card .store{font-size:15px;font-weight:500}
.record-card .time{font-size:12px;color:#999}
.record-card .product{font-size:13px;color:#666;margin-bottom:6px}
.record-card .reason{display:inline-block;font-size:12px;color:#c9302c;background:#fbeae9;padding:2px 8px;border-radius:4px}
.empty{text-align:center;padding:60px 24px;color:#999;font-size:13px}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px 0;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;border-bottom:.5px solid rgba(0,0,0,.08)}
.sheet-hd span{font-size:15px;font-weight:500}
.sheet-hd .close{font-size:22px;color:#999;cursor:pointer;width:30px;text-align:right}
.sheet-item{padding:14px 16px;font-size:14px;color:#333;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sheet-item:not(:last-child){border-bottom:.5px solid rgba(0,0,0,.06)}
.sheet-item.active{color:#c9302c}
.sheet-item .check{width:18px;height:18px;display:none}
.sheet-item.active .check{display:block}

.date-modal{align-items:center;padding:24px}
.date-panel{width:100%;max-width:300px;background:#fff;border-radius:12px;padding:20px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.date-panel h3{font-size:16px;font-weight:500;margin-bottom:16px;text-align:center}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-row input{width:100%;height:40px;border:1px solid rgba(0,0,0,.15);border-radius:8px;padding:0 12px;font-size:14px;outline:none}
.form-row input:focus{border-color:#c9302c}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;height:38px;border-radius:999px;border:none;font-size:14px;cursor:pointer}
.btns .cancel{background:#f5f6f7;color:#666}
.btns .confirm{background:#c9302c;color:#fff}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">产品明细</span>
  </div>

  <div class="content">
    <div class="filter-bar">
      <div class="filter-item" onclick="showStoreSheet()">
        <div>
          <div class="label">门店</div>
          <div class="value" id="storeText">全部门店</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="filter-item" onclick="showDateModal()">
        <div>
          <div class="label">时间段</div>
          <div class="value" id="dateText">全部时间</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
    <div id="recordList"></div>
  </div>

  <div class="modal" id="storeSheetModal" onclick="closeStoreSheet(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-hd">
        <span>选择门店</span>
        <span class="close" onclick="hideStoreSheet()">×</span>
      </div>
      <div class="sheet-list">
        <div class="sheet-item active" data-store="all" onclick="selectStore('all','全部门店')">
          <span>全部门店</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-store="湘江东路店" onclick="selectStore('湘江东路店','湘江东路店')">
          <span>湘江东路店</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-store="五一广场店" onclick="selectStore('五一广场店','五一广场店')">
          <span>五一广场店</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-store="岳麓山北店" onclick="selectStore('岳麓山北店','岳麓山北店')">
          <span>岳麓山北店</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="modal date-modal" id="dateModal" onclick="closeDateModal(event)">
    <div class="date-panel" onclick="event.stopPropagation()">
      <h3>选择时间段</h3>
      <div class="form-row">
        <label>开始时间</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-row">
        <label>结束时间</label>
        <input type="date" id="endDate">
      </div>
      <div class="btns">
        <button class="cancel" onclick="hideDateModal()">取消</button>
        <button class="confirm" onclick="confirmDate()">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const records=[
  {store:'湘江东路店',product:'迈极炫·槟榔（15颗/袋）',reason:'产品激活',time:'2026-08-27 10:23:18'},
  {store:'五一广场店',product:'迈极炫·槟榔（15颗/袋）',reason:'产品激活',time:'2026-08-27 09:45:06'},
  {store:'岳麓山北店',product:'迈极炫定制打火机',reason:'兑奖核销',time:'2026-08-26 16:30:22'},
  {store:'湘江东路店',product:'迈极炫·槟榔（15颗/袋）',reason:'产品回收',time:'2026-08-26 14:12:55'},
  {store:'五一广场店',product:'品牌毛巾套装',reason:'兑奖核销',time:'2026-08-26 11:08:37'},
  {store:'岳麓山北店',product:'迈极炫·槟榔（15颗/袋）',reason:'产品激活',time:'2026-08-25 17:20:09'},
  {store:'湘江东路店',product:'迈极炫帆布袋',reason:'兑奖核销',time:'2026-08-25 10:05:41'},
  {store:'五一广场店',product:'迈极炫·槟榔（15颗/袋）',reason:'产品激活',time:'2026-08-24 15:33:28'}
];
let currentStore='all';
let startDate='';
let endDate='';

function render(){
  const box=document.getElementById('recordList');
  let list=records;
  if(currentStore!=='all')list=list.filter(r=>r.store===currentStore);
  if(startDate && endDate)list=list.filter(r=>r.time>=startDate+' 00:00:00' && r.time<=endDate+' 23:59:59');
  if(!list.length){box.innerHTML='<div class="empty">暂无变动记录</div>';return;}
  box.innerHTML=list.map(r=>`<div class="record-card"><div class="hd"><span class="store">${r.store}</span><span class="time">${r.time}</span></div><div class="product">${r.product}</div><span class="reason">${r.reason}</span></div>`).join('');
}

function showStoreSheet(){document.getElementById('storeSheetModal').classList.add('show');}
function hideStoreSheet(){document.getElementById('storeSheetModal').classList.remove('show');}
function closeStoreSheet(e){if(e.target.id==='storeSheetModal')hideStoreSheet();}
function selectStore(store,text){
  currentStore=store;
  document.querySelectorAll('#storeSheetModal .sheet-item').forEach(t=>t.classList.remove('active'));
  document.querySelector(`#storeSheetModal .sheet-item[data-store="${store}"]`).classList.add('active');
  document.getElementById('storeText').textContent=text;
  hideStoreSheet();
  render();
}

function showDateModal(){document.getElementById('dateModal').classList.add('show');}
function hideDateModal(){document.getElementById('dateModal').classList.remove('show');}
function closeDateModal(e){if(e.target.id==='dateModal')hideDateModal();}
function confirmDate(){
  startDate=document.getElementById('startDate').value;
  endDate=document.getElementById('endDate').value;
  if(!startDate||!endDate){toast('请选择开始和结束时间');return;}
  if(startDate>endDate){toast('开始时间不能晚于结束时间');return;}
  document.getElementById('dateText').textContent=startDate+' 至 '+endDate;
  hideDateModal();
  render();
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

render();
</script>
</body>
</html>
