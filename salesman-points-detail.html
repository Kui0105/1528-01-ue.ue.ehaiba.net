<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 业务员积分明细</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}

/* 余额头 */
.balance{background:linear-gradient(135deg,#c9302c,#e8645f);color:#fff;padding:18px 16px;flex-shrink:0}
.balance .lb{font-size:13px;opacity:.9;margin-bottom:6px}
.balance .num{font-size:28px;font-weight:600}
.balance .num small{font-size:13px;font-weight:400;margin-left:4px}

/* 时间段选择（开始/结束外置） */
.filter-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.date-box{flex:1;min-width:0;height:34px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 10px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:6px}
.date-box:active{background:#fafafa}
.date-box.active{border-color:#c9302c;background:#fff5f5}
.date-box .ico{width:14px;height:14px;flex-shrink:0;color:#c9302c;opacity:.75}
.date-box.active .ico{opacity:1}
.date-box .val{font-size:12.5px;color:#333;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-box .val.empty{color:#bbb;font-weight:400}
.filter-bar .sep{font-size:12px;color:#bbb;flex-shrink:0}
.filter-bar .reset{font-size:11.5px;color:#c9302c;border:.5px solid rgba(201,48,44,.35);border-radius:999px;padding:4px 10px;flex-shrink:0;cursor:pointer;background:#fff;line-height:1.1}

.summary{padding:6px 12px;font-size:11px;line-height:1.3;color:#999;background:#f5f6f7;flex-shrink:0}
.summary b{color:#c9302c;font-weight:600}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.rec{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.rec .left{flex:1;min-width:0}
.rec .reason{font-size:14px;font-weight:500;margin-bottom:6px;line-height:1.4}
.rec .time{font-size:12px;color:#999}
.rec .right{text-align:right;flex-shrink:0}
.rec .delta{font-size:16px;font-weight:600;color:#c9302c;margin-bottom:4px}
.rec .bal{font-size:11px;color:#999}

.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}

/* 年月日选择弹层 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:400;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.show{opacity:1;pointer-events:auto}
.picker-sheet{position:absolute;left:0;right:0;bottom:0;height:300px;background:#fff;z-index:401;border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s}
.picker-sheet.show{transform:translateY(0)}
.rs-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid rgba(0,0,0,.08)}
.rs-head .rs-cancel,.rs-head .rs-confirm{font-size:14px;cursor:pointer;padding:4px}
.rs-head .rs-cancel{color:#999}
.rs-head .rs-confirm{color:#c9302c;font-weight:500}
.rs-head .rs-title{font-size:15px;font-weight:500}
.rs-body{flex:1;display:flex;overflow:hidden}
.rs-col{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0}
.rs-col+.rs-col{border-left:.5px solid rgba(0,0,0,.05)}
.rs-item{text-align:center;font-size:14px;padding:11px 4px;color:#333}
.rs-item.active{color:#c9302c;font-weight:600;background:rgba(201,48,44,.06)}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:600;opacity:0;pointer-events:none;transition:all .2s;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">积分明细</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="balance">
    <div class="lb">当前积分余额</div>
    <div class="num">8,600<small>分</small></div>
  </div>

  <div class="filter-bar">
    <div class="date-box" id="startBox" onclick="openPicker('start')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      <span class="val empty" id="startText">开始时间</span>
    </div>
    <span class="sep">至</span>
    <div class="date-box" id="endBox" onclick="openPicker('end')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      <span class="val empty" id="endText">结束时间</span>
    </div>
    <span class="reset" onclick="resetRange()">重置</span>
  </div>

  <div class="summary" id="summary"></div>
  <div class="content" id="content"></div>

  <!-- 年月日选择弹层 -->
  <div class="mask" id="pickerMask" onclick="closePicker()"></div>
  <div class="picker-sheet" id="pickerSheet">
    <div class="rs-head">
      <span class="rs-cancel" onclick="closePicker()">取消</span>
      <span class="rs-title" id="pickerTitle">选择开始时间</span>
      <span class="rs-confirm" onclick="confirmPicker()">确定</span>
    </div>
    <div class="rs-body">
      <div class="rs-col" id="colYear"></div>
      <div class="rs-col" id="colMonth"></div>
      <div class="rs-col" id="colDay"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* 业务员积分明细：仅有管理端/奖励发放（增加），无扣减记录
   offset 为距今天数，日期在渲染时按当前日期动态计算 */
const records=[
  {offset:0,time:'15:20:11',reason:'管理端发放积分',delta:500,balance:8600},
  {offset:0,time:'09:12:33',reason:'铺货达标奖励积分',delta:300,balance:8100},
  {offset:1,time:'17:42:08',reason:'推荐门店奖励积分',delta:800,balance:7800},
  {offset:2,time:'11:06:52',reason:'活动奖励积分',delta:600,balance:7000},
  {offset:3,time:'16:31:20',reason:'管理端发放积分',delta:1200,balance:6400},
  {offset:5,time:'10:48:07',reason:'任务完成奖励积分',delta:400,balance:5200},
  {offset:6,time:'14:05:39',reason:'铺货达标奖励积分',delta:900,balance:4800},
  {offset:12,time:'09:55:14',reason:'管理端发放积分',delta:1500,balance:3900},
  {offset:20,time:'15:22:46',reason:'推荐门店奖励积分',delta:1000,balance:2400},
  {offset:45,time:'13:18:02',reason:'活动奖励积分',delta:1400,balance:1400}
];

let startDate='',endDate='';
function pad(n){return String(n).padStart(2,'0');}
function dateFor(offset){
  const d=new Date();
  d.setDate(d.getDate()-offset);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}

function match(r){
  const d=dateFor(r.offset);
  if(startDate&&d<startDate)return false;
  if(endDate&&d>endDate)return false;
  return true;
}
function render(){
  const box=document.getElementById('content');
  const list=records.filter(match);
  const sum=list.reduce((s,r)=>s+r.delta,0);

  const st=document.getElementById('startText');
  const et=document.getElementById('endText');
  st.textContent=startDate||'开始时间';
  et.textContent=endDate||'结束时间';
  st.classList.toggle('empty',!startDate);
  et.classList.toggle('empty',!endDate);
  document.getElementById('startBox').classList.toggle('active',!!startDate);
  document.getElementById('endBox').classList.toggle('active',!!endDate);

  const rangeTxt=(startDate||endDate)?((startDate||'不限')+' 至 '+(endDate||'不限')+' · '):'';
  document.getElementById('summary').innerHTML=rangeTxt+'共 '+list.length+' 笔 · 累计增加 <b>'+sum.toLocaleString('en-US')+'</b> 积分';

  if(list.length===0){box.innerHTML='<div class="empty">该时间段暂无积分变动记录</div>';return;}
  box.innerHTML=list.map(r=>`
    <div class="rec">
      <div class="left">
        <div class="reason">${r.reason}</div>
        <div class="time">${dateFor(r.offset)} ${r.time}</div>
      </div>
      <div class="right">
        <div class="delta">+${r.delta.toLocaleString('en-US')}</div>
        <div class="bal">余额 ${r.balance.toLocaleString('en-US')}</div>
      </div>
    </div>`).join('');
}

/* 年月日选择 */
let pickerTarget='start';
let selY=0,selM=0,selD=0;
function openPicker(target){
  pickerTarget=target;
  document.getElementById('pickerTitle').textContent=target==='start'?'选择开始时间':'选择结束时间';
  const cur=target==='start'?startDate:endDate;
  const base=cur?new Date(cur):new Date();
  selY=base.getFullYear();selM=base.getMonth()+1;selD=base.getDate();
  renderPicker();
  document.getElementById('pickerMask').classList.add('show');
  document.getElementById('pickerSheet').classList.add('show');
}
function renderPicker(){
  const nowYear=new Date().getFullYear();
  const years=[];
  for(let y=nowYear-1;y<=nowYear;y++)years.push(y);
  if(years.indexOf(selY)<0)selY=years[years.length-1];
  document.getElementById('colYear').innerHTML=years.map(y=>`<div class="rs-item ${y===selY?'active':''}" onclick="pickYear(${y})">${y}年</div>`).join('');
  const months=[];
  for(let m=1;m<=12;m++)months.push(m);
  document.getElementById('colMonth').innerHTML=months.map(m=>`<div class="rs-item ${m===selM?'active':''}" onclick="pickMonth(${m})">${pad(m)}月</div>`).join('');
  const max=daysInMonth(selY,selM);
  if(selD>max)selD=max;
  const days=[];
  for(let d=1;d<=max;d++)days.push(d);
  document.getElementById('colDay').innerHTML=days.map(d=>`<div class="rs-item ${d===selD?'active':''}" onclick="pickDay(${d})">${pad(d)}日</div>`).join('');
  ['colYear','colMonth','colDay'].forEach(scrollActive);
}
function pickYear(y){selY=y;renderPicker();}
function pickMonth(m){selM=m;renderPicker();}
function pickDay(d){selD=d;renderPicker();}
function scrollActive(col){
  const el=document.getElementById(col);const act=el.querySelector('.active');
  if(act)el.scrollTop=act.offsetTop-el.clientHeight/2+act.clientHeight/2;
}
function closePicker(){
  document.getElementById('pickerMask').classList.remove('show');
  document.getElementById('pickerSheet').classList.remove('show');
}
function confirmPicker(){
  const val=selY+'-'+pad(selM)+'-'+pad(selD);
  if(pickerTarget==='start'){
    if(endDate&&val>endDate){toast('开始时间不能晚于结束时间');return;}
    startDate=val;
  }else{
    if(startDate&&val<startDate){toast('结束时间不能早于开始时间');return;}
    endDate=val;
  }
  closePicker();
  render();
}
function resetRange(){startDate='';endDate='';render();}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script>
</body>
</html>
