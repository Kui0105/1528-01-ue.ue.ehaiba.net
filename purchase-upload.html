<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 进货上传</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:16px;margin-bottom:12px}
.card .title{font-size:15px;font-weight:500;margin-bottom:14px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field .label{font-size:13px;color:#666;margin-bottom:7px;display:block}
.field select,.field input{width:100%;height:40px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none;color:#333}
.field select:focus,.field input:focus{border-color:#c9302c}
.upload-box{height:96px;border:.5px dashed rgba(0,0,0,.2);border-radius:10px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#999;font-size:13px;cursor:pointer}
.upload-box svg{width:26px;height:26px}
.submit{width:100%;height:44px;background:#c9302c;color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;margin-top:4px}
.submit:active{opacity:.9}

.list-title{font-size:14px;color:#999;margin:4px 2px 10px}
.rec{display:flex;align-items:center;gap:12px;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.rec .pic{width:40px;height:40px;border-radius:8px;background:#fff7f7;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rec .main{flex:1;min-width:0}
.rec .name{font-size:14px;font-weight:500;margin-bottom:3px}
.rec .sub{font-size:12px;color:#999}
.rec .status{font-size:12px;padding:2px 8px;border-radius:4px;flex-shrink:0}
.rec .status.done{color:#2a9d4f;background:rgba(42,157,79,.1)}
.rec .status.pending{color:#d48806;background:rgba(212,136,6,.1)}
.empty{text-align:center;padding:60px 24px;color:#999;font-size:13px}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">进货上传</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="content">
    <div class="card">
      <div class="title">进货信息</div>
      <div class="field">
        <label class="label">进货产品</label>
        <select id="prodSel">
          <option value="迈极炫槟榔 20元装">迈极炫槟榔 20元装</option>
          <option value="迈极炫槟榔 50元装">迈极炫槟榔 50元装</option>
          <option value="迈极炫槟榔 100元装">迈极炫槟榔 100元装</option>
          <option value="迈极炫礼盒套装">迈极炫礼盒套装</option>
        </select>
      </div>
      <div class="field">
        <label class="label">进货数量（件）</label>
        <input id="qtyInput" type="number" placeholder="请输入进货数量" value="200">
      </div>
      <div class="field">
        <label class="label">进货单价（元）</label>
        <input id="priceInput" type="number" placeholder="请输入进货单价" value="16">
      </div>
      <div class="field">
        <label class="label">进货凭证</label>
        <div class="upload-box" onclick="toast('请选择进货凭证图片')">
          <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>
          <div>点击上传进货凭证</div>
        </div>
      </div>
      <button class="submit" onclick="submitUpload()">提交进货</button>
    </div>

    <div class="list-title">最近上传</div>
    <div id="list"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const records=[
  {name:'迈极炫槟榔 50元装',qty:300,time:'2026-08-26 14:20',status:'done'},
  {name:'迈极炫槟榔 100元装',qty:120,time:'2026-08-24 09:45',status:'done'},
  {name:'迈极炫槟榔 20元装',qty:500,time:'2026-08-22 16:10',status:'pending'}
];
function render(){
  const box=document.getElementById('list');
  if(records.length===0){box.innerHTML='<div class="empty">暂无上传记录</div>';return;}
  box.innerHTML=records.map(r=>`
    <div class="rec">
      <div class="pic">📦</div>
      <div class="main">
        <div class="name">${r.name}</div>
        <div class="sub">${r.qty} 件 · ${r.time}</div>
      </div>
      <span class="status ${r.status}">${r.status==='done'?'已入库':'待入库'}</span>
    </div>`).join('');
}
function pad(n){return String(n).padStart(2,'0');}
function nowStr(){
  const d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function submitUpload(){
  const name=document.getElementById('prodSel').value;
  const qty=document.getElementById('qtyInput').value;
  if(!qty||qty<=0){toast('请输入有效的进货数量');return;}
  records.unshift({name:name,qty:parseInt(qty),time:nowStr(),status:'pending'});
  render();
  toast('进货单已提交，等待入库');
}
let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
render();
</script>
</body>
</html>
