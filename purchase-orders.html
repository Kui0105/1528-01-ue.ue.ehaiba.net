<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 进货订单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.search{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.search input{flex:1;height:36px;border:.5px solid rgba(0,0,0,.12);border-radius:8px;padding:0 12px;font-size:14px;background:#fafafa;outline:none}
.search input:focus{border-color:#c9302c}
.search button{width:60px;height:36px;background:#c9302c;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.tabs{display:flex;background:#fff;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0}
.tabs .tab{flex:1;text-align:center;padding:11px 0;font-size:13px;color:#666;cursor:pointer;position:relative}
.tabs .tab.active{color:#c9302c;font-weight:500}
.tabs .tab.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:24px;height:2px;background:#c9302c;border-radius:2px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .no{font-size:13px;color:#999}
.card .status{font-size:12px;padding:2px 8px;border-radius:4px}
.card .status.done{color:#2a9d4f;background:rgba(42,157,79,.1)}
.card .status.pending{color:#d48806;background:rgba(212,136,6,.1)}
.card .status.reject{color:#999;background:#f2f2f2}
.card .name{font-size:15px;font-weight:500;margin-bottom:8px}
.card .info{display:flex;font-size:13px;color:#666;line-height:1.8}
.card .info .col{flex:1}
.card .info .label{color:#999}
.card .oi{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid rgba(0,0,0,.05);font-size:13px;color:#333}
.card .oi .pic{width:34px;height:34px;border-radius:8px;background:#fff7f7;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.card .oi .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .oi .u{color:#999;font-size:12px;margin:0 4px}
.card .oi .q{color:#666}
.card .sum{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:.5px solid rgba(0,0,0,.08);font-size:13px;color:#666}
.card .sum .amt{color:#c9302c;font-weight:600}
.card .detail-btn{margin-top:10px;text-align:right;font-size:13px;color:#c9302c;cursor:pointer}
.empty{text-align:center;padding:80px 24px;color:#999;font-size:13px}

/* 详情弹窗 */
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{width:320px;max-height:78%;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid rgba(0,0,0,.08)}
.modal .m-head .mh-title{font-size:15px;font-weight:600}
.modal .m-head .mh-close{font-size:20px;color:#999;cursor:pointer;line-height:1}
.modal .m-body{overflow-y:auto;padding:14px 16px}
.modal .m-sec{font-size:12px;color:#999;margin:14px 0 6px}
.modal .m-sec:first-child{margin-top:0}
.modal .m-row{display:flex;font-size:13px;color:#333;line-height:1.9}
.modal .m-row .k{width:72px;color:#999;flex-shrink:0}
.modal .m-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid rgba(0,0,0,.05)}
.modal .m-item .pic{width:36px;height:36px;border-radius:8px;background:#fff7f7;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.modal .m-item .n{flex:1;min-width:0;font-size:13px}
.modal .m-item .sub{color:#999;font-size:11px}
.modal .m-item .q{font-size:12px;color:#999}
.modal .m-sum{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:.5px solid rgba(0,0,0,.08);font-size:13px;color:#666}
.modal .m-sum .amt{color:#c9302c;font-weight:600}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:600;opacity:0;pointer-events:none;transition:all .2s;max-width:80%}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="goBack()">‹</span>
    <span class="title">进货订单</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>
  <div class="search">
    <input type="text" id="kw" placeholder="搜索订单号/产品名称" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-s="all" onclick="setTab('all')">全部</div>
    <div class="tab" data-s="pending" onclick="setTab('pending')">待入库</div>
    <div class="tab" data-s="done" onclick="setTab('done')">已入库</div>
    <div class="tab" data-s="reject" onclick="setTab('reject')">已驳回</div>
  </div>
  <div class="content" id="content"></div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="detailMask" onclick="closeDetail()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="m-head">
        <span class="mh-title">订单详情</span>
        <span class="mh-close" onclick="closeDetail()">×</span>
      </div>
      <div class="m-body" id="detailBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const defaultOrders=[
  {no:'JH202608260012',name:'迈极炫槟榔 50元装',qty:300,price:42,date:'2026-08-26',status:'done'},
  {no:'JH202608240008',name:'迈极炫槟榔 100元装',qty:120,price:86,date:'2026-08-24',status:'done'},
  {no:'JH202608220005',name:'迈极炫槟榔 20元装',qty:500,price:16,date:'2026-08-22',status:'pending'},
  {no:'JH202608180003',name:'迈极炫礼盒套装',qty:60,price:96,date:'2026-08-18',status:'done'},
  {no:'JH202608150001',name:'迈极炫礼盒套装',qty:80,price:86,date:'2026-08-15',status:'reject'}
];
let orders=defaultOrders.slice();
try{
  const extra=JSON.parse(localStorage.getItem('mall_orders')||'[]');
  if(Array.isArray(extra)&&extra.length)orders=extra.concat(orders);
}catch(e){}
const statusMap={done:'已入库',pending:'待入库',reject:'已驳回'};
let orderMap={};
orders.forEach(o=>orderMap[o.no]=o);
let curTab='all';

function setTab(s){curTab=s;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.s===s));render();}
function render(kw){
  kw=(kw||'').trim().toLowerCase();
  const box=document.getElementById('content');
  let list=orders.filter(o=>{
    if(curTab!=='all'&&o.status!==curTab)return false;
    if(kw&&!(o.no+(o.name||'')).toLowerCase().includes(kw))return false;
    return true;
  });
  if(list.length===0){box.innerHTML='<div class="empty">未找到匹配的进货订单</div>';return;}
  box.innerHTML=list.map(o=>{
    let body;
    if(o.items&&o.items.length){
      const rows=o.items.map(it=>`<div class="oi"><span class="pic">${it.emoji}</span><span class="n">${it.name}</span><span class="u">${it.unit}</span><span class="q">¥${it.price} ×${it.qty}</span></div>`).join('');
      body=`<div class="info" style="display:block">${rows}</div><div class="sum"><span>合计 ${o.total} 件</span><span class="amt">¥${o.amount.toLocaleString('en-US')}</span></div>`;
    }else{
      body=`<div class="info"><div class="col"><span class="label">数量</span> ${o.qty} 件</div><div class="col"><span class="label">单价</span> ¥${o.price}</div><div class="col"><span class="label">日期</span> ${o.date}</div></div>`;
    }
    return `<div class="card">
      <div class="top">
        <span class="no">${o.no}</span>
        <span class="status ${o.status}">${statusMap[o.status]}</span>
      </div>
      <div class="name">${o.name}</div>
      ${body}
      <div class="detail-btn" onclick="openDetail('${o.no}')">查看详情 ›</div>
    </div>`;
  }).join('');
}
function doSearch(){render(document.getElementById('kw').value);}

function openDetail(no){
  const o=orderMap[no];
  if(!o){toast('未找到订单');return;}
  let html='';
  html+=`<div class="m-row"><span class="k">订单号</span><span>${o.no}</span></div>`;
  html+=`<div class="m-row"><span class="k">状态</span><span>${statusMap[o.status]||o.status}</span></div>`;
  if(o.date)html+=`<div class="m-row"><span class="k">日期</span><span>${o.date}</span></div>`;
  html+=`<div class="m-sec">商品清单</div>`;
  if(o.items&&o.items.length){
    html+=o.items.map(it=>`<div class="m-item"><span class="pic">${it.emoji}</span><span class="n">${it.name}<br><span class="sub">${it.unit} · ¥${it.price}</span></span><span class="q">×${it.qty}</span></div>`).join('');
    html+=`<div class="m-sum"><span>合计 ${o.total} 件</span><span class="amt">¥${o.amount.toLocaleString('en-US')}</span></div>`;
  }else{
    html+=`<div class="m-row"><span class="k">商品</span><span>${o.name||'-'}</span></div>`;
    html+=`<div class="m-row"><span class="k">数量</span><span>${o.qty} 件</span></div>`;
    html+=`<div class="m-row"><span class="k">单价</span><span>¥${o.price}</span></div>`;
  }
  if(o.region||o.contact||o.phone||o.address||o.remark){
    html+=`<div class="m-sec">收货信息</div>`;
    if(o.region)html+=`<div class="m-row"><span class="k">地区</span><span>${o.region}</span></div>`;
    if(o.contact)html+=`<div class="m-row"><span class="k">收货人</span><span>${o.contact}</span></div>`;
    if(o.phone)html+=`<div class="m-row"><span class="k">联系电话</span><span>${o.phone}</span></div>`;
    if(o.address)html+=`<div class="m-row"><span class="k">详细地址</span><span>${o.address}</span></div>`;
    if(o.remark)html+=`<div class="m-row"><span class="k">备注</span><span>${o.remark}</span></div>`;
  }
  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail(){document.getElementById('detailMask').classList.remove('show');}

function goBack(){
  const r=localStorage.getItem('orders_return');
  if(r){localStorage.removeItem('orders_return');location.href=r;}
  else history.back();
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script>
</body>
</html>
