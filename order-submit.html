<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 订单提交</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;position:relative;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.capsule{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:87px;height:30px;border:.5px solid rgba(0,0,0,.12);border-radius:15px;display:flex;align-items:center;background:#fff}
.capsule .c-left,.capsule .c-right{flex:1;display:flex;align-items:center;justify-content:center}
.capsule .c-left{font-size:11px;letter-spacing:-1px}
.capsule .c-right .dot{width:13px;height:13px;border:1.4px solid #1a1a1a;border-radius:50%}
.capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f6f7;padding:10px 12px 90px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:14px;margin-bottom:10px}

/* address */
.addr-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.addr-row .pin{width:36px;height:36px;border-radius:50%;background:#fcebeb;color:#c9302c;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.addr-row .info{flex:1;min-width:0}
.addr-row .info .name{font-size:15px;font-weight:500;color:#1a1a1a;margin-bottom:4px}
.addr-row .info .name span{font-size:13px;color:#666;margin-left:8px;font-weight:400}
.addr-row .info .addr{font-size:13px;color:#666;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.addr-row .arrow{color:#999;font-size:18px}
.addr-empty{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.addr-empty span{font-size:14px;color:#666}
.addr-empty .add{padding:6px 14px;background:#c9302c;color:#fff;border-radius:999px;font-size:13px}

/* goods */
.goods-row{display:flex;gap:12px}
.goods-row .img{width:80px;flex-shrink:0;aspect-ratio:1/1;background:#f5f6f7;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;overflow:hidden}
.goods-row .info{flex:1;min-width:0}
.goods-row .name{font-size:14px;font-weight:500;color:#1a1a1a;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goods-row .meta{display:flex;justify-content:space-between;align-items:center}
.goods-row .points{font-size:15px;font-weight:600;color:#c9302c}
.goods-row .qty{font-size:13px;color:#666}

/* row list */
.row-list .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06)}
.row-list .row:last-child{border-bottom:none}
.row-list .row .label{font-size:14px;color:#333;white-space:nowrap;flex-shrink:0;margin-right:12px}
.row-list .row .value{font-size:14px;color:#666}
.row-list .row .value.red{color:#c9302c;font-weight:500}

/* note */
.note-area{width:100%;min-height:60px;border:none;outline:none;resize:none;font-size:14px;color:#1a1a1a;line-height:1.5;background:transparent}
.note-area::placeholder{color:#bbb}

/* bottom bar */
.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid rgba(0,0,0,.08);padding:8px 12px;display:flex;align-items:center;gap:12px;z-index:20}
.footer .total{flex:1;font-size:13px;color:#666;line-height:1.5}
.footer .total .num{font-size:16px;font-weight:600;color:#c9302c}
.footer .pay{flex-shrink:0;background:#c9302c;color:#fff;border:none;border-radius:999px;padding:11px 28px;font-size:15px;font-weight:500;cursor:pointer}
.footer .pay:active{opacity:.9}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">订单提交</span>
    <span class="capsule"><span class="c-left">•••</span><span class="divider"></span><span class="c-right"><span class="dot"></span></span></span>
  </div>

  <div class="content">
    <!-- address -->
    <div class="card">
      <div class="addr-row" id="addrRow" onclick="goAddress()" style="display:none">
        <div class="pin">📍</div>
        <div class="info">
          <div class="name">张三 <span>138****8888</span></div>
          <div class="addr">广东省 广州市 天河区 科韵路 123 号某某大厦 18 楼</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="addr-empty" id="addrEmpty" onclick="goAddress()">
        <span>请选择收货地址</span>
        <span class="add">+ 添加地址</span>
      </div>
    </div>

    <!-- goods info -->
    <div class="card">
      <div class="goods-row">
        <div class="img" id="goodsImg">商品图</div>
        <div class="info">
          <div class="name" id="goodsName">商品名称</div>
          <div class="meta">
            <span class="points" id="goodsPoints">0 积分</span>
            <span class="qty" id="goodsQty">x1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- fee & note -->
    <div class="card row-list">
      <div class="row">
        <span class="label">配送运费</span>
        <span class="value" id="shipFee">¥6.00</span>
      </div>
      <div class="row" style="align-items:flex-start">
        <span class="label" style="padding-top:2px">订单备注</span>
        <textarea class="note-area" id="noteInput" placeholder="选填，请输入订单备注"></textarea>
      </div>
    </div>
  </div>

  <!-- bottom bar -->
  <div class="footer">
    <div class="total">
      <div>共 <span id="totalQty">1</span> 件，所需积分 <span class="num" id="totalPoints">0</span></div>
      <div>运费 <span id="footerFee">¥6.00</span></div>
    </div>
    <button class="pay" onclick="doPay()">立即支付</button>
  </div>

<div class="toast" id="toast"></div>
</div>


<script>
const goods=[
  {name:'迈极炫定制打火机',points:500,ex:1280,cat:'数码家电'},
  {name:'迈极炫品牌数据线',points:300,ex:2560,cat:'数码家电'},
  {name:'迈极炫零食大礼包',points:800,ex:890,cat:'食品生鲜'},
  {name:'迈极炫保温杯',points:1200,ex:560,cat:'家居日用'},
  {name:'迈极炫充电宝',points:2500,ex:320,cat:'数码家电'},
  {name:'迈极炫品牌T恤',points:1500,ex:430,cat:'服饰箱包'},
  {name:'迈极炫棒球帽',points:900,ex:670,cat:'服饰箱包'},
  {name:'迈极炫电动牙刷',points:1800,ex:210,cat:'家居日用'}
];

const params=new URLSearchParams(location.search);
const gid=parseInt(params.get('id')||'0',10);
const qty=parseInt(params.get('qty')||'1',10);
const g=goods[gid]||goods[0];
const shipFee=6;

// simulate address selected from URL
const addr=params.get('addr');
if(addr){
  document.getElementById('addrEmpty').style.display='none';
  document.getElementById('addrRow').style.display='flex';
}

document.getElementById('goodsName').textContent=g.name;
document.getElementById('goodsPoints').textContent=g.points+' 积分';
document.getElementById('goodsQty').textContent='x'+qty;
document.getElementById('totalQty').textContent=qty;
document.getElementById('totalPoints').textContent=(g.points*qty).toLocaleString();

function goAddress(){
  location.href=`address.html?from=order&oid=${gid}&qty=${qty}`;
}

function doPay(){
  // simulate WeChat Pay
  toast('调用微信支付运费 ¥'+shipFee.toFixed(2));
  setTimeout(()=>{
    toast('支付成功，订单进入待发货状态');
  },1200);
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
