<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 业务推广</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{position:relative;width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;margin-bottom:12px;overflow:hidden}

.user-card{display:flex;align-items:center;gap:14px;padding:18px 14px}
.user-card .avatar{width:56px;height:56px;border-radius:50%;background:#f5f6f7;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;border:.5px solid rgba(0,0,0,.06)}
.user-card .info{flex:1;min-width:0}
.user-card .info .name{font-size:16px;font-weight:500;margin-bottom:5px}
.user-card .info .phone{font-size:13px;color:#666;margin-bottom:4px}
.user-card .info .dealer{font-size:13px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stat-card{padding:14px}
.stat-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stat-title{font-size:15px;font-weight:500}
.filter-trigger{display:flex;align-items:center;gap:4px;font-size:13px;color:#666;cursor:pointer;padding:4px 8px;border:.5px solid rgba(0,0,0,.12);border-radius:6px;background:#fff}
.filter-trigger svg{width:14px;height:14px}
.stat-grid{display:flex}
.stat-item{flex:1;text-align:center;position:relative}
.stat-item:not(:last-child)::after{content:'';position:absolute;right:0;top:8px;bottom:8px;width:.5px;background:rgba(0,0,0,.08)}
.stat-item .num{font-size:22px;font-weight:600;color:#c9302c;margin-bottom:4px}
.stat-item .label{font-size:12px;color:#666}

.menu-card{padding:14px}
.menu-title{font-size:15px;font-weight:500;margin-bottom:14px}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.menu-item .icon{width:46px;height:46px;border-radius:12px;background:#fff;border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:22px}
.menu-item .label{font-size:12px;color:#333}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-panel{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px;animation:slideUp .22s ease;max-height:70%;display:flex;flex-direction:column}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-hd h3{font-size:16px;font-weight:500}
.modal-hd .close{font-size:24px;color:#999;cursor:pointer;width:30px;text-align:right}
.store-list{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:360px}
.store-item{padding:14px 0;border-bottom:.5px solid rgba(0,0,0,.06);cursor:pointer}
.store-item:last-child{border-bottom:none}
.store-item .store-name{font-size:14px;font-weight:500;margin-bottom:4px}
.store-item .store-addr{font-size:12px;color:#999}
.store-item:active{background:#fafafa}

.scan-panel{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:24px 20px 28px;display:flex;flex-direction:column;align-items:center;animation:slideUp .22s ease}
.scan-frame{width:220px;height:220px;border:.5px solid rgba(0,0,0,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:#f5f6f7;margin-bottom:20px;overflow:hidden}
.scan-frame::before{content:'';position:absolute;left:15px;top:15px;right:15px;bottom:15px;border:2px solid #c9302c;border-radius:8px}
.scan-frame .scan-line{position:absolute;left:20px;right:20px;height:2px;background:#c9302c;box-shadow:0 0 6px rgba(201,48,44,.5);animation:scan 1.6s linear infinite}
@keyframes scan{0%{top:20px}50%{top:200px}100%{top:20px}}
.scan-frame p{position:absolute;bottom:30px;font-size:12px;color:#999}
.scan-btn{width:100%;height:44px;background:#c9302c;color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:10px}
.scan-cancel{width:100%;height:40px;background:transparent;color:#666;border:.5px solid rgba(0,0,0,.12);border-radius:999px;font-size:14px;cursor:pointer}

.filter-sheet{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:16px 0;animation:slideUp .22s ease}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;border-bottom:.5px solid rgba(0,0,0,.08)}
.sheet-hd span{font-size:15px;font-weight:500}
.sheet-hd .close{font-size:22px;color:#999;cursor:pointer;width:30px;text-align:right}
.sheet-item{padding:14px 16px;font-size:14px;color:#333;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sheet-item:not(:last-child){border-bottom:.5px solid rgba(0,0,0,.06)}
.sheet-item.active{color:#c9302c}
.sheet-item .check{width:18px;height:18px;display:none}
.sheet-item.active .check{display:block}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title">业务推广</span>
  </div>

  <div class="content">
    <div class="card user-card">
      <div class="avatar">👤</div>
      <div class="info">
        <div class="name">业务员：张三</div>
        <div class="phone">138****8888</div>
        <div class="dealer">经销商：长沙总经销</div>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-hd">
        <div class="stat-title">数据统计</div>
        <div class="filter-trigger" onclick="showFilterSheet()">
          <span id="filterText">今日</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="num" id="statPut">128</div>
          <div class="label">铺货量</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statVerify">86</div>
          <div class="label">兑奖量</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statStore">42</div>
          <div class="label">铺货门店</div>
        </div>
      </div>
    </div>

    <div class="card menu-card">
      <div class="menu-title">功能入口</div>
      <div class="menu-grid">
        <div class="menu-item" onclick="location.href='activate.html'">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="14" rx="2"></rect>
              <circle cx="12" cy="13" r="4"></circle>
              <path d="M8 6l1-2h6l1 2"></path>
            </svg>
          </div>
          <div class="label">产品激活</div>
        </div>
        <div class="menu-item" onclick="location.href='recycle.html'">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 12a8 8 0 1 1-16 0"></path>
              <path d="M4 12l4-4"></path>
              <path d="M4 12h6"></path>
            </svg>
          </div>
          <div class="label">产品回收</div>
        </div>
        <div class="menu-item" onclick="location.href='verify-prize.html'">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </div>
          <div class="label">兑奖核销</div>
        </div>
        <div class="menu-item" onclick="location.href='store.html'">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"></path>
              <path d="M5 21V10l7-4 7 4v11"></path>
              <path d="M9 21v-6h6v6"></path>
            </svg>
          </div>
          <div class="label">门店管理</div>
        </div>
        <div class="menu-item" onclick="location.href='product-detail.html'">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
              <path d="M12 12l8-4.5"></path>
              <path d="M12 12v9"></path>
              <path d="M12 12L4 7.5"></path>
            </svg>
          </div>
          <div class="label">产品明细</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="filterModal" onclick="closeFilterModal(event)">
    <div class="filter-sheet" onclick="event.stopPropagation()">
      <div class="sheet-hd">
        <span>选择时间</span>
        <span class="close" onclick="hideFilterSheet()">×</span>
      </div>
      <div class="sheet-list">
        <div class="sheet-item active" data-type="today" onclick="selectFilter('today','今日')">
          <span>今日</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="yesterday" onclick="selectFilter('yesterday','昨日')">
          <span>昨日</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="week" onclick="selectFilter('week','本周')">
          <span>本周</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="sheet-item" data-type="month" onclick="selectFilter('month','本月')">
          <span>本月</span>
          <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const statData={
  today:{put:128,verify:86,store:42},
  yesterday:{put:112,verify:74,store:38},
  week:{put:856,verify:612,store:96},
  month:{put:3520,verify:2846,store:128}
};
function showFilterSheet(){document.getElementById('filterModal').classList.add('show');}
function hideFilterSheet(){document.getElementById('filterModal').classList.remove('show');}
function closeFilterModal(e){if(e.target.id==='filterModal')hideFilterSheet();}
function selectFilter(type,label){
  document.querySelectorAll('.sheet-item').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.sheet-item[data-type="${type}"]`).classList.add('active');
  document.getElementById('filterText').textContent=label;
  const d=statData[type];
  document.getElementById('statPut').textContent=d.put;
  document.getElementById('statVerify').textContent=d.verify;
  document.getElementById('statStore').textContent=d.store;
  hideFilterSheet();
}

let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
</script>
</body>
</html>
