<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迈极炫 · 分类</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#eceef1;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.mp{width:100%;max-width:420px;margin:0 auto;height:100%;min-height:100vh;display:flex;flex-direction:column;background:#f5f6f7;overflow:hidden}
.statusbar{height:28px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13px;font-weight:500;flex-shrink:0}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.sb-ico{width:15px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-ico::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative}
.sb-bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#1a1a1a;border-radius:1px}
.sb-bat::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:14px;background:#1a1a1a;border-radius:1px}
.navbar{height:44px;background:#fff;border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:22px;color:#1a1a1a;width:40px;height:44px;display:flex;align-items:center;cursor:pointer}
.navbar .title{width:100%;text-align:center;font-size:16px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.filter-bar{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:10px;display:flex;align-items:center;margin-bottom:12px;overflow:hidden}
.filter-tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.filter-tab.active{color:#c9302c;font-weight:500}
.filter-tab .arrow{display:inline-flex;flex-direction:column;align-items:center;gap:1px;width:8px;height:10px;position:relative}
.filter-tab .arrow i{display:block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.filter-tab .arrow .up{border-bottom:4px solid #bbb}
.filter-tab .arrow .down{border-top:4px solid #bbb;margin-top:-1px}
.filter-tab.active .arrow .up{border-bottom-color:#c9302c}
.filter-tab.active .arrow .down{border-top-color:#c9302c}
.filter-tab.asc .arrow .up{border-bottom-color:#c9302c}
.filter-tab.asc .arrow .down{border-top-color:#ddd}
.filter-tab.desc .arrow .up{border-bottom-color:#ddd}
.filter-tab.desc .arrow .down{border-top-color:#c9302c}

.goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.goods-card{background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;cursor:pointer}
.goods-card .img{aspect-ratio:1/1;background:#f5f6f7;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px}
.goods-card .info{padding:10px}
.goods-card .name{font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goods-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#999}
.goods-card .meta .pt{color:#c9302c;font-weight:600;font-size:13px}
.empty{text-align:center;padding:60px 20px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="mp">
  <div class="statusbar"><span>10:25</span><span class="right"><span class="sb-ico"></span><span class="sb-bat"></span></span></div>
  <div class="navbar">
    <span class="back" onclick="history.back()">‹</span>
    <span class="title" id="catTitle">分类</span>
  </div>
  <div class="content">
    <div class="filter-bar">
      <div class="filter-tab active" data-mode="all" onclick="setFilter(this,'all')">综合</div>
      <div class="filter-tab" data-mode="sales" onclick="setFilter(this,'sales')">销量<span class="arrow"><i class="up"></i><i class="down"></i></span></div>
      <div class="filter-tab" data-mode="price" onclick="setFilter(this,'price')">价格<span class="arrow"><i class="up"></i><i class="down"></i></span></div>
    </div>
    <div class="goods-grid" id="goodsGrid"></div>
    <div class="empty" id="empty" style="display:none">该分类暂无商品</div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const catName=decodeURIComponent(params.get('name')||'分类列表');
document.getElementById('catTitle').textContent=catName;

const allGoods=[
  {name:'迈极炫定制打火机',points:500,orig:'¥39.90',ex:128,cats:['数码家电','家居日用']},
  {name:'便携收纳盒',points:300,orig:'¥19.90',ex:86,cats:['家居日用']},
  {name:'品牌毛巾套装',points:800,orig:'¥59.00',ex:45,cats:['家居日用','服饰箱包']},
  {name:'迈极炫帆布袋',points:450,orig:'¥29.90',ex:72,cats:['服饰箱包']},
  {name:'迷你蓝牙音箱',points:1500,orig:'¥129.00',ex:23,cats:['数码家电']},
  {name:'品牌钥匙扣',points:200,orig:'¥9.90',ex:210,cats:['汽车用品','潮玩周边']},
  {name:'纯牛奶一箱',points:1200,orig:'¥58.00',ex:56,cats:['食品生鲜']},
  {name:'保温杯',points:900,orig:'¥79.00',ex:34,cats:['家居日用','汽车用品']},
  {name:'品牌面膜套装',points:1100,orig:'¥99.00',ex:28,cats:['美妆个护']},
  {name:'儿童拼图',points:350,orig:'¥25.00',ex:67,cats:['母婴玩具']},
  {name:'优酷月卡',points:600,orig:'¥20.00',ex:189,cats:['卡券权益']},
  {name:'经典名著一本',points:400,orig:'¥32.00',ex:92,cats:['图书文具']}
];

let list=allGoods.filter(g=>g.cats.includes(catName));
let filterMode='all';
let sortDir='asc';
const grid=document.getElementById('goodsGrid');
const empty=document.getElementById('empty');

function sortList(){
  if(filterMode==='all')return list.slice();
  const arr=list.slice();
  if(filterMode==='sales'){
    arr.sort((a,b)=>sortDir==='asc'?a.ex-b.ex:b.ex-a.ex);
  }else if(filterMode==='price'){
    arr.sort((a,b)=>sortDir==='asc'?a.points-b.points:b.points-a.points);
  }
  return arr;
}

function render(){
  const data=sortList();
  grid.innerHTML='';
  if(data.length===0){
    grid.style.display='none';
    empty.style.display='block';
  }else{
    grid.style.display='grid';
    empty.style.display='none';
    data.forEach((g,i)=>{
      const el=document.createElement('div');
      el.className='goods-card';
      el.onclick=()=>location.href='goods-detail.html?id='+allGoods.indexOf(g);
      el.innerHTML=`<div class="img">商品图</div><div class="info"><div class="name">${g.name}</div><div class="meta"><span class="pt">${g.points} 积分</span><span>已兑 ${g.ex}</span></div></div>`;
      grid.appendChild(el);
    });
  }
}

function setFilter(el,mode){
  const tabs=document.querySelectorAll('.filter-tab');
  if(filterMode===mode){
    sortDir=sortDir==='asc'?'desc':'asc';
  }else{
    filterMode=mode;
    sortDir=mode==='price'?'asc':'desc';
  }
  tabs.forEach(t=>{
    t.classList.remove('active','asc','desc');
    if(t.dataset.mode===filterMode){
      t.classList.add('active');
      if(filterMode!=='all')t.classList.add(sortDir);
    }
  });
  render();
}

render();
</script>
</body>
</html>
